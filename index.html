                                    <h3 class="font-semibold text-xl text-gray-800 dark:text-gray-100">Seu Plano de Estudos está pronto para ser construído!</h3>
                                    <p class="mt-2">Parece que você ainda não adicionou nenhuma matéria. Para começar, vá até o <strong>Editor de Edital</strong>.</p>
                                    <button data-action="goToSyllabusEditor" class="mt-6 bg-[#3B3A82] text-white font-bold py-2 px-6 rounded-lg hover:bg-[#2A3A8D] transition-colors">
                                        Ir para o Editor de Edital
                                    </button>
                                    <div class="mt-6 text-sm text-left border-t border-gray-200 dark:border-slate-700 pt-4">
                                        <p class="font-semibold text-center mb-2">Lá você pode:</p>
                                        <ul class="list-disc list-inside space-y-1 inline-block text-left">
                                            <li>Adicionar matérias personalizadas do zero.</li>
                                            <li>Importar editais completos da nossa Biblioteca.</li>
                                            <li>Selecionar e adicionar múltiplas matérias de uma só vez.</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        `;
                        return;
                    }

                    const syllabusColorMap = new Map();
                    let colorIndex = 0;
                    this.data.subjects.forEach(s => {
                        if (s.sourceSyllabusName && !syllabusColorMap.has(s.sourceSyllabusName)) {
                            syllabusColorMap.set(s.sourceSyllabusName, this.syllabusColors[colorIndex % this.syllabusColors.length]);
                            colorIndex++;
                        }
                    });

                    const subjects = this.data.subjects || [];

                    // 1. Calcular dados para ordenação e exibição
                    let subjectsWithData = subjects.map(s => {
                        const overdueCount = s.topics.filter(t => t.phase >= 2 && t.nextReviewDate && dayjs(t.nextReviewDate).isBefore(dayjs().tz("America/Sao_Paulo").startOf('day'))).length;

                        const phaseWeights = { 0: 0, 1: 0, 2: 0.25, 3: 0.50, 4: 0.75, 5: 1.0 };
                        const progress = s.topics.length > 0
                            ? (s.topics.reduce((acc, t) => acc + (phaseWeights[t.phase] || 0), 0) / s.topics.length) * 100
                            : 0;

                        const phaseCounts = s.topics.reduce((acc, topic) => {
                            acc[topic.phase] = (acc[topic.phase] || 0) + 1;
                            return acc;
                        }, {});

                        return {
                            ...s,
                            overdueCount,
                            progress,
                            phaseCounts
                        };
                    });

                    // 2. Ordenar os dados
                    if (this.activeSort === 'my_order') {
                        subjectsWithData.sort((a, b) => a.orderIndex - b.orderIndex);
                    } else if (this.activeSort === 'progress') {
                        subjectsWithData.sort((a, b) => a.progress - b.progress);
                    } else if (this.activeSort === 'overdue') {
                        subjectsWithData.sort((a, b) => b.overdueCount - a.overdueCount || a.name.localeCompare(b.name));
                    } else if (this.activeSort === 'alphabetical') {
                        subjectsWithData.sort((a, b) => a.name.localeCompare(b.name));
                    }

                    // 3. Gerar o HTML do cabeçalho de ordenação
                    const sortOptions = [
                        { id: 'my_order', label: 'Minha Ordem' },
                        { id: 'progress', label: 'Progresso' },
                        { id: 'overdue', label: 'Atrasadas' },
                        { id: 'alphabetical', label: 'A-Z' }
                    ];
                    const sortButtonsHTML = sortOptions.map(opt => {
                        const isActive = this.activeSort === opt.id;
                        let buttonContent = `<span>${opt.label}</span>`;
                        
                        if (opt.id === 'my_order') {
                            buttonContent += `
                                <div class="tooltip ml-1">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-gray-400 dark:text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    <span class="tooltiptext">Esta é a ordem personalizada definida no Editor de Edital.</span>
                                </div>`;

                        const buttonClasses = `sort-btn text-sm font-medium px-3 py-1 rounded-md transition-colors flex items-center ${isActive ? 'bg-white text-teal-700 shadow dark:bg-slate-700 dark:text-teal-400' : 'bg-transparent text-gray-600 hover:bg-gray-300/50 dark:text-gray-300 dark:hover:bg-slate-700'}`;
                        
                        return `<button data-sort-by="${opt.id}" class="${buttonClasses}">${buttonContent}</button>`;

                    // 4. Gerar o HTML dos cards
                    const cardsHTML = subjectsWithData.map(subject => {
                        const sourceName = subject.sourceSyllabusName || 'Edital Pessoal';
                        const dotColor = subject.sourceSyllabusName ? syllabusColorMap.get(subject.sourceSyllabusName) : 'bg-gray-400';

                        const phaseDistributionHTML = this.phasesData.map(phase => {

                        return `

                                            <p class="flex items-center font-semibold text-red-600 dark:text-red-500">

                                                ${subject.overdueCount} revisão(ões) atrasada(s)!
                                            </p>
                                        ` : ''}
                                    </div>
                                </div>
                                <div>
                                    <div class="mb-3">
                                        <div class="flex justify-between mb-1">
                                            <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Progresso Geral</span>
                                            <span class="text-sm font-medium text-[#3B3A82] dark:text-[#5DBCD2]">${subject.progress.toFixed(0)}%</span>
                                        </div>
                                        <div class="w-full bg-gray-200 dark:bg-slate-700 rounded-full h-2.5">
                                            <div class="bg-[#5DBCD2] h-2.5 rounded-full" style="width: ${subject.progress}%"></div>
                                        </div>
                                    </div>
                                    <div class="border-t border-gray-200 dark:border-slate-700 pt-3">

                                        <div class="flex items-center space-x-4 flex-wrap gap-y-2">
                                            ${phaseDistributionHTML}

                                </div>
                            </div>

                    // 5. Atualizar o DOM
                    this.subjectsGrid.innerHTML = `
                        <div class="col-span-full mb-0 flex flex-wrap items-center justify-between gap-4">

                        </div>

                renderCustomDateModal(subjectId, topicId, fromFailure = false) {
                    const topic = this.findTopic(subjectId, topicId);
                    if (!topic) return;

                    const content = `
                        <p class="mb-4 dark:text-gray-300">Escolha a data específica para a próxima revisão de "<strong>${this.getTopicText(topic)}</strong>":</p>
                        <input type="date" id="custom-review-date" class="w-full p-2 border border-gray-300 dark:bg-slate-700 dark:border-slate-600 dark:text-gray-300 rounded-md" min="${dayjs().tz("America/Sao_Paulo").format('YYYY-MM-DD')}">
                    `;
                    const footer = `
                        <div class="flex justify-end">
                            <button id="save-custom-date-btn" class="bg-[#3B3A82] text-white px-4 py-2 rounded-lg hover:bg-[#2A3A8D]">Agendar Revisão</button>
                        </div>
                    `;
                    this.renderModal('Agendar Revisão Personalizada', content, footer);

                    this.el('save-custom-date-btn').onclick = () => {
                        const selectedDate = this.el('custom-review-date').value;
                        if (!selectedDate) {
                            this.renderFeedbackModal("Erro", "Por favor, selecione uma data.");
                            return;
                        }

                        const today = dayjs().tz("America/Sao_Paulo").startOf('day');
                        if (dayjs(selectedDate).isBefore(today)) {
                            this.renderFeedbackModal("Data Inválida", "Não é possível agendar uma tarefa para o passado. Por favor, escolha uma data a partir de hoje.");
                            return;
                        }
                        
                        topic.nextReviewDate = selectedDate;
                        topic.lastReviewDate = dayjs().tz("America/Sao_Paulo").format('YYYY-MM-DD');

                        if (fromFailure) {
                            topic.consecutiveSuccesses = 0;
                        } else {
                            if (topic.phase < 2) this.updatePhase(topic, 2);
                        }
                        
                        this.saveData();
                        this.closeModal(); 
                        if (this.el('active-modal')) this.closeModal(); 
                        
                        const formattedDate = dayjs(selectedDate).format('DD/MM/YYYY');
                        this.renderFeedbackModal(
                            "Revisão Reagendada!",
                            `Sua revisão foi agendada para <strong>${formattedDate}</strong>. O próximo intervalo será recalculado com base no seu desempenho nesta nova tentativa. O Sinapsy se adapta ao seu ritmo!`,
                             [{ id: 'feedback-ok-btn', text: 'Entendido', classes: 'bg-teal-600 text-white px-4 py-2 rounded-lg', onClick: () => {
                                 this.closeModal();
                                 this.renderAll();
                             }}]
                        );
                    };
                },
renderMissionModal(subjectId, topicId) {
    this.renderTopicAtomModal(subjectId, topicId);
},

renderTopicAtomModal(subjectId, topicId) {
    const subject = this.data.subjects.find(s => s.id === subjectId);
    if (!subject) return;

    const topic = this.findTopic(subjectId, topicId);
    if (!topic) return;

    const title = `${this.getTopicText(topic)}`;
    
    const content = `
        <div class="space-y-4">
            <div id="topic-atom-banners"></div>
            <div id="topic-atom-main-layout"></div>
        </div>
    `;

    this.renderModal(title, content, '', 'topic-atom-modal');
    
    const modalContentWrapper = this.el('active-modal')?.querySelector('.bg-white');
    if (modalContentWrapper) {
        modalContentWrapper.classList.remove('max-w-4xl');
        modalContentWrapper.classList.add('max-w-6xl');
    }

    const today = dayjs().tz("America/Sao_Paulo").startOf('day');
    let advanceNoticeHTML = '';
    if (topic.nextReviewDate && dayjs(topic.nextReviewDate).isAfter(today) && !topic.prescribedMission) {
        const originalDate = dayjs(topic.nextReviewDate);
        advanceNoticeHTML = `
            <div class="bg-blue-100 border-l-4 border-blue-500 text-blue-700 p-4 dark:bg-blue-900/30 dark:text-blue-300 rounded-r-lg" role="alert">

                    </button>

        case 3:

findSubjectIdForTopic(topicId) {
    for (const subject of this.data.subjects) {
        if (subject.topics.some(t => t.id === topicId)) {
            return subject.id;
        }
    }
    return null;
},

handlePerformance(subjectId, topicId) {
    const topic = this.findTopic(subjectId, topicId);
    if (!topic) return;

    const mission = topic.prescribedMission;
    const isMultiTopic = mission && (mission.type === 'interleaved_practice' || mission.type === 'synthesis_practice');
    
    const correctInput = this.el('review-correct-questions');
    const totalInput = this.el('review-total-questions');
    const correct = parseInt(correctInput.value, 10);
    const total = parseInt(totalInput.value, 10);
    const minQuestions = isMultiTopic
        ? (mission.type === 'synthesis_practice' ? 10 : 15)
        : (topic.phase === 5 ? 10 : 15);

    if (isNaN(correct) || isNaN(total) || total < 1 || correct > total || total < minQuestions) {
        this.renderFeedbackModal("Dados Inválidos", `Por favor, insira um total de pelo menos ${minQuestions} questões e garanta que o número de acertos não seja maior que o total.`);
        return;
    }

    this.closeModal();
    const accuracy = (correct / total) * 100;

    const onFeedbackProvided = (feedback) => {
        const topicsToUpdate = isMultiTopic
            ? mission.relatedTopics
            : [{ subjectId: subjectId, id: topicId }];

        topicsToUpdate.forEach(t_info => {
            const topicToUpdate = this.findTopic(t_info.subjectId, t_info.id);
            if (topicToUpdate) {
                if (topicToUpdate.prescribedMission) topicToUpdate.prescribedMission = null;
                this.updateTopicQuizHistory(t_info.subjectId, t_info.id, correct, total, feedback);
                
                const lastHistoryEntry = topicToUpdate.quizHistory[topicToUpdate.quizHistory.length - 1] || {};
                this.updateTopicICS(topicToUpdate, {
                    performance: accuracy,
                    feedback: {
                        type: lastHistoryEntry.feedbackType,
                        data: lastHistoryEntry.userFeedback
                    }
                });
                this.updateIEM(topicToUpdate, lastHistoryEntry);
                topicToUpdate.averageAccuracy = this.calculateAverageAccuracy(topicToUpdate);
            }
        });

        this.saveData();
        this.renderTopicAtomModal(subjectId, topicId);

        // Show the result modal only ONCE, for the main topic that initiated the mission.
        this.showPerformanceResultModal(subjectId, topicId, correct, total);
    };

    if (accuracy === 100) {
        this.renderConfidenceValidationModal(subjectId, topicId, correct, total, onFeedbackProvided);
    } else {
        this.renderGuidedAutopsyModal(subjectId, topicId, correct, total, onFeedbackProvided);
    }
},

showPerformanceResultModal(subjectId, topicId, correct, total) {
    const topic = this.findTopic(subjectId, topicId);
    if (!topic) return;

    const accuracy = (correct / total) * 100;

    this.updateAchievementProgress('questions_solved', total);
    if (accuracy === 100 && total >= 20) {
        this.updateAchievementProgress('perfect_reviews_count', 1);
    }
    if (topic.quizHistory.length > 1) {
        const previousTry = topic.quizHistory[topic.quizHistory.length - 2];
        if ((previousTry.correct / previousTry.total * 100) < 70 && accuracy >= 90) {
            this.updateAchievementProgress('comebacks_count', 1);
        }
    }

    const phaseGoals = {
        2: { threshold: 80, successesNeeded: 1, nextPhase: 3, nextInterval: 3 },
        3: { threshold: 80, successesNeeded: 2, nextPhase: 4, nextInterval: 28, midInterval: 7 },
        4: { threshold: 85, successesNeeded: 2, nextPhase: 5, nextInterval: 90, midInterval: 28 },
        5: { threshold: 85, successesNeeded: 1, nextPhase: 5, nextInterval: 90, failureInterval: 30 }
    };

    let threshold;
    const mission = topic.prescribedMission;

    if (mission) {
        switch (mission.type) {
            case 'volume_challenge':
                threshold = 75;
                break;
            case 'risk_mitigation_reinforcement':
                threshold = 80;
                break;
            case 'pattern_correction':
                threshold = 85;
                break;
            default:
                // Fallback for standard missions or multi-topic missions without a specific threshold
                threshold = phaseGoals[topic.phase]?.threshold || 80;
                break;
        }
    } else {
        threshold = phaseGoals[topic.phase]?.threshold || 80; // Default phase goal
    }

    const goal = phaseGoals[topic.phase]; // Still need this for other properties

    if (accuracy >= threshold) {
        this.addXp(10);
        
        if(topic.phase === 2 && topic.quizHistory.length === 0) {
            this.triggerSingleAchievement('fast_domain');
        }

        topic.highPerformanceSuccesses = accuracy >= 90 ? (topic.highPerformanceSuccesses || 0) + 1 : 0;
        if (topic.highPerformanceSuccesses === 2) {
            this.triggerSingleAchievement('flawless_streak');
        }

        if (topic.phase === 5) {
            topic.nextReviewDate = dayjs().tz("America/Sao_Paulo").add(goal.nextInterval, 'day').format('YYYY-MM-DD');
            this.renderFeedbackModal("Maestria Mantida! 👑", `Excelente! Com ${accuracy.toFixed(0)}% de acertos, você provou que ainda domina este assunto. Próxima revisão de manutenção em 90 dias.`);
        } else {
            topic.consecutiveSuccesses = (topic.consecutiveSuccesses || 0) + 1;
            if (topic.consecutiveSuccesses >= goal.successesNeeded) {
                this.addXp(25);
                const oldPhaseName = this.phasesData[topic.phase].name;

                const historyForAdvance = topic.quizHistory.slice(- (goal.successesNeeded - 1));
                historyForAdvance.push({ performance: accuracy });
                const averagePerformance = historyForAdvance.reduce((sum, h) => sum + h.performance, 0) / historyForAdvance.length;

                let nextInterval = goal.nextInterval;
                let feedbackMessage = "";

                if (accuracy < 100 && averagePerformance < (goal.threshold + 5)) {
                    nextInterval = Math.ceil(goal.nextInterval / 2);
                    feedbackMessage = `Como seu desempenho foi consistente, mas próximo da meta, a Sinapsy IA prescreveu uma revisão de consolidação em um intervalo menor, para garantir que o conhecimento seja totalmente solidificado. Sua próxima revisão foi agendada para daqui a ${nextInterval} dias.`;
                } else {
                    feedbackMessage = `Sua próxima revisão foi agendada para <strong>${dayjs().add(nextInterval, 'day').format('DD/MM/YYYY')}</strong>.`;
                }

                this.updatePhase(topic, goal.nextPhase);
                topic.nextReviewDate = dayjs().tz("America/Sao_Paulo").add(nextInterval, 'day').format('YYYY-MM-DD');
                topic.consecutiveSuccesses = 0;

                const nextPhaseName = this.phasesData[topic.phase].name;
                this.renderFeedbackModal("Parabéns! 🚀", `Com ${accuracy.toFixed(0)}% de acertos, você dominou a fase de <strong>${oldPhaseName}</strong> e avançou para a <strong>Fase de ${nextPhaseName}</strong>. ${feedbackMessage}`);

            } else {
                topic.nextReviewDate = dayjs().tz("America/Sao_Paulo").add(goal.midInterval, 'day').format('YYYY-MM-DD');
                const successesLeft = goal.successesNeeded - topic.consecutiveSuccesses;
                const nextPhaseName = this.phasesData[goal.nextPhase].name;
                const nextReviewDateFormatted = dayjs(topic.nextReviewDate).format('DD/MM/YYYY');
                this.renderFeedbackModal("Ótimo Desempenho! 👍", `Você atingiu a meta com ${accuracy.toFixed(0)}% de acertos. Você precisa de mais <strong>${successesLeft} sucesso(s) consecutivo(s)</strong> para avançar para a fase de <strong>${nextPhaseName}</strong>. Sua próxima revisão foi agendada para <strong>${nextReviewDateFormatted}</strong>.`);
            }
        }
    } else {
        topic.highPerformanceSuccesses = 0;
        topic.consecutiveSuccesses = 0;

        if (topic.phase === 5) {
            topic.nextReviewDate = dayjs().tz("America/Sao_Paulo").add(goal.failureInterval, 'day').format('YYYY-MM-DD');
            this.renderFeedbackModal("Ponto de Atenção!", `Seu desempenho foi de <strong>${accuracy.toFixed(0)}%</strong>. Para um tópico em maestria, é bom revisar com mais frequência. Uma nova revisão de manutenção foi agendada para daqui a 30 dias.`);
        } else {
            topic.nextReviewDate = dayjs().tz("America/Sao_Paulo").add(1, 'day').format('YYYY-MM-DD');
            const buttons = [
                { id: 'retry-tomorrow-btn', text: 'Ok, Tentar Amanhã', classes: 'bg-[#3B3A82] text-white px-4 py-2 rounded-lg', onClick: () => this.closeModal() },
                { id: 'schedule-manual-btn', text: 'Agendar Manualmente', classes: 'bg-gray-200 hover:bg-gray-300 dark:bg-slate-600 dark:hover:bg-slate-500 dark:text-gray-200 px-4 py-2 rounded-lg', onClick: (e) => this.handleTopicAction('scheduleManually', subjectId, topicId, e.target) }
            ];
            this.renderFeedbackModal("Quase lá!", `Seu desempenho foi de <strong>${accuracy.toFixed(0)}%</strong>. A meta para esta fase é de <strong>${goal.threshold}%</strong>. A recomendação é reforçar seu material de estudo. Uma nova tentativa foi agendada para <strong>amanhã</strong>, mas você pode reagendar se preferir.`, buttons);
        }
    }
    
    this.saveData();
    this.renderAll();
},

// Adicione estas funções dentro do objeto App
renderIcsGeneralChart() {
    const allHistory = (this.data.subjects || []).flatMap(s => s.topics.flatMap(t => t.icsHistory || []));
    const canvas = this.el('chart-ics-geral');
    if (!canvas) return;

    if (allHistory.length === 0) {
        const ctx = canvas.getContext('2d');
        if (this.activeCharts['chart-ics-geral']) this.activeCharts['chart-ics-geral'].destroy();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.textAlign = 'center';
        ctx.fillStyle = document.documentElement.classList.contains('dark') ? '#94a3b8' : '#6b7280';
        ctx.fillText('Nenhum histórico de ICS para exibir. Os dados aparecerão aqui amanhã.', canvas.width / 2, canvas.height / 2);
        return;
    }

    const dailyData = {};
    allHistory.forEach(entry => {
        if (!dailyData[entry.date]) { dailyData[entry.date] = { sum: 0, count: 0 }; }
        dailyData[entry.date].sum += entry.score;
        dailyData[entry.date].count++;
    });

    const sortedDates = Object.keys(dailyData).sort((a, b) => new Date(a) - new Date(b));
    const labels = sortedDates.map(date => dayjs(date).format('DD/MM'));
    const data = sortedDates.map(date => dailyData[date].sum / dailyData[date].count);

    const isDark = document.documentElement.classList.contains('dark');
    const chartColor = isDark ? 'rgba(20, 184, 166, 0.2)' : 'rgba(20, 184, 166, 0.2)';
    const chartBorderColor = isDark ? 'rgba(20, 184, 166, 1)' : 'rgba(13, 148, 136, 1)';

    this.renderChart('chart-ics-geral', 'line', labels, data, chartBorderColor, {
        scales: { y: { beginAtZero: true, max: 100 } },
        datasets: [{
            label: 'ICS Médio', data, fill: true,
            backgroundColor: chartColor,
            borderColor: chartBorderColor,
            tension: 0.4,
            pointBackgroundColor: chartBorderColor,
            pointHoverRadius: 6
        }]
    });
},

// ADICIONE esta nova função dentro do objeto App = { ... }
renderPatternCharts() {
    console.log("Executando a VERSÃO CORRIGIDA E FINAL de renderPatternCharts.");
    if (!this.data || !this.data.studyPatterns) return;

    const patterns = this.data.studyPatterns;
    const isDark = document.documentElement.classList.contains('dark');
    const textColor = isDark ? 'rgba(203, 213, 225, 0.7)' : 'rgba(100, 116, 139, 0.7)';
    
    const miniBarOptions = {
        maintainAspectRatio: false,
        plugins: { legend: { display: false }, tooltip: { enabled: true } },
        scales: { 
            y: { display: false, grid: { display: false }, beginAtZero: true },
            x: { display: true, ticks: { color: textColor, font: { size: 9 } }, grid: { display: false } }
        }
    };
    const miniDonutOptions = {
        maintainAspectRatio: false,
        cutout: '60%',
        plugins: { legend: { display: false }, tooltip: { enabled: true } }
    };

    if (patterns.timeOfDayData && patterns.timeOfDayData.data && this.el('chart-pattern-best-time')) {
        const highlightColor = 'rgba(20, 184, 166, 0.8)';
        const baseColor = 'rgba(20, 184, 166, 0.3)';
        const backgroundColors = patterns.timeOfDayData.labels.map(label => label === patterns.bestStudyTime ? highlightColor : baseColor);
        this.renderChart('chart-pattern-best-time', 'bar', patterns.timeOfDayData.labels, patterns.timeOfDayData.data, backgroundColors, miniBarOptions);
    }
    if (patterns.dayOfWeekData && patterns.dayOfWeekData.data && this.el('chart-pattern-strongest-day')) {
        const dayNames = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
        const shortDayLabels = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
        const highlightColor = 'rgba(59, 130, 246, 0.8)';
        const baseColor = 'rgba(59, 130, 246, 0.3)';
        const backgroundColors = dayNames.map(day => day === patterns.strongestDay ? highlightColor : baseColor);
        this.renderChart('chart-pattern-strongest-day', 'bar', shortDayLabels, patterns.dayOfWeekData.data, backgroundColors, miniBarOptions);
    }
    if (patterns.errorTypeData && patterns.errorTypeData.data && this.el('chart-pattern-error-type')) {
        const errorColors = ['#ef4444', '#f97316', '#eab308', '#84cc16', '#6b7280'];
        const friendlyLabels = patterns.errorTypeData.labels.map(l => this.errorTypeNames[l] || l);
        this.renderChart('chart-pattern-error-type', 'doughnut', friendlyLabels, patterns.errorTypeData.data, errorColors, miniDonutOptions);
    }

    if (this.el('chart-pattern-pace')) {
        const paceValueMapping = { 'Inativo': 0, 'Esporádico': 25, 'Consistente': 65, 'Intensivo': 95 };
        const paceValue = paceValueMapping[patterns.studyPace] || 0;
        
        const paceColorMapping = { 'Inativo': '#9ca3af', 'Esporádico': '#ef4444', 'Consistente': '#f59e0b', 'Intensivo': '#22c55e' };
        const activeColor = paceColorMapping[patterns.studyPace] || '#9ca3af';
        
        const gaugeData = {
            datasets: [{
                data: [paceValue, 100 - paceValue],
                backgroundColor: [activeColor, isDark ? '#334155' : '#e2e8f0'],
                borderWidth: 0,
                circumference: 180,
                rotation: -90
            }]
        };
        const gaugeOptions = {
            maintainAspectRatio: false,
            cutout: '60%',
            plugins: {
                legend: { display: false },
                tooltip: { 
                    enabled: true,
                    callbacks: {
                       label: () => `${patterns.studyPace}: ${paceValue}% de intensidade`
                    }
                }
            }
        };
        
        if (this.activeCharts['chart-pattern-pace']) this.activeCharts['chart-pattern-pace'].destroy();
        const ctx = this.el('chart-pattern-pace').getContext('2d');
        this.activeCharts['chart-pattern-pace'] = new Chart(ctx, {
            type: 'doughnut',
            data: gaugeData,
            options: gaugeOptions
        });
    }
},

            const validTopics = s.topics.filter(t => t.ics !== undefined);
            if (validTopics.length > 0) {
                labels.push(s.name);
                const avgIcs = validTopics.reduce((sum, t) => sum + t.ics, 0) / validTopics.length;
                data.push(avgIcs);
            }
        });
    } else {
        const subject = this.data.subjects.find(s => s.id === subjectFilter);
        if (subject) {
            const topicOptions = subject.topics.map(t => `<option value="${t.id}">${this.getTopicText(t)}</option>`).join('');
            topicSelect.innerHTML = `<option value="all">Todos os Tópicos</option>${topicOptions}`;
            topicSelect.disabled = false;

            if (topicFilter === 'all') {
                subject.topics.forEach(t => {
                    labels.push(this.getTopicText(t));
                    data.push(t.ics || 0);
                });
            } else {
                const topic = this.findTopic(subjectFilter, topicFilter);
                if (topic) {
                    chartType = 'radar';
                    indexAxis = 'x'; 
                    labels = ['ICS Atual', 'IEM', 'Aproveitamento Médio'];
                    data = [
                        topic.ics || 0,
                        topic.iemScore || 0,
                        topic.averageAccuracy || 0,
                    ];
                }
            }
        }
    }

    this.renderChart('chart-ics-comparison', chartType, labels, data, 'rgba(54, 162, 235, 0.5)', {
        scales: { 
            y: { beginAtZero: true, max: 100, display: indexAxis === 'y' },
            x: { display: indexAxis === 'x' },
            r: { angleLines: { display: true }, suggestedMin: 0, suggestedMax: 100 }
        },
        indexAxis: indexAxis
    });
},

renderMarkdown(text) {
    if (!text) return '';
    text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\*(.*?)\*/g, '<em>$1</em>');
    const lines = text.split('\n');
    let html = '';
    let inList = false;
    lines.forEach(line => {
        if (line.startsWith('### ')) {
            if (inList) { html += '</ul>'; inList = false; }
            html += `<h3 class="text-xl font-bold text-gray-800 dark:text-gray-100 mt-4 mb-2">${line.substring(4)}</h3>`;
        } else if (line.startsWith('#### ')) {
            if (inList) { html += '</ul>'; inList = false; }
            html += `<h4 class="text-lg font-semibold text-gray-700 dark:text-gray-200 mt-3 mb-1">${line.substring(5)}</h4>`;
        } else if (line.startsWith('- ')) {
            if (!inList) {
                html += '<ul class="list-disc list-inside space-y-1 my-2">';
                inList = true;
            }
            html += `<li>${line.substring(2)}</li>`;
        } else {
            if (inList) {
                html += '</ul>';
                inList = false;
            }
            if (line.trim() !== '') {
                html += `<p class="my-2">${line}</p>`;
            }
        }
    });
    if (inList) { html += '</ul>'; }
    return html;
},
                calculateStats() {
                    let totalTopics = 0;
                    let weightedProgressSum = 0;
                    const phaseWeights = { 0: 0, 1: 0, 2: 0.25, 3: 0.50, 4: 0.75, 5: 1.0 };

                    let totalCorrect = 0;
                    let totalQuestions = 0; // Este total é para a média de aproveitamento, não para conquistas
                    const phaseCounts = Array(this.phasesData.length).fill(0);
                    const subjectProgress = {};
                    
                    if (this.data.subjects) {
                        this.data.subjects.forEach(s => {
                            let subjectWeightedProgress = 0;
                            
                            s.topics.forEach(t => {
                                weightedProgressSum += phaseWeights[t.phase] || 0;
                                phaseCounts[t.phase]++;
                                
                                if (t.quizHistory && t.quizHistory.length > 0) {
                                    t.quizHistory.forEach(h => {
                                        totalCorrect += h.correct;
                                        totalQuestions += h.total;
                                    });
                                }
                            });

                            if(s.topics.length > 0){
                                subjectProgress[s.id] = (s.topics.reduce((acc, t) => acc + (phaseWeights[t.phase] || 0), 0) / s.topics.length) * 100;
                            } else {
                                subjectProgress[s.id] = 0;
                            }
                        });
                        totalTopics = this.data.subjects.reduce((sum, s) => sum + s.topics.length, 0);
                    }
                    
                    return {
                        overallProgress: totalTopics > 0 ? (weightedProgressSum / totalTopics) * 100 : 0,
                        averageAccuracy: totalQuestions > 0 ? (totalCorrect / totalQuestions) * 100 : 0,
                        totalQuestions: this.data.userAchievements.questions_solved || 0, // CORREÇÃO
                        streak: this.data.userAchievements.current_streak || 0, // CORREÇÃO
                        phaseDistribution: { labels: this.phasesData.map(p => p.name), data: phaseCounts },
                        quizPerformance: this.calculateQuizPerformance(),
                        subjectProgress
                    };

                calculateQuizPerformance() {
                    const performanceBySubject = [];
                    if (!this.data.subjects) return [];

                    this.data.subjects.forEach(s => {
                        let subjectCorrect = 0;
                        let subjectTotal = 0;

                        s.topics.forEach(t => {
                            if (t.quizHistory && t.quizHistory.length > 0) {
                                subjectCorrect += t.quizHistory.reduce((sum, h) => sum + h.correct, 0);
                                subjectTotal += t.quizHistory.reduce((sum, h) => sum + h.total, 0);
                            }
                        });

                        if (subjectTotal > 0) {
                            performanceBySubject.push({
                                name: s.name,
                                accuracy: (subjectCorrect / subjectTotal) * 100,
                                totalQuestions: subjectTotal
                            });
                        }
                    });
                    return performanceBySubject;

renderChart(ctxId, type, labels, data, colors, customOptions = {}) {
    if (this.activeCharts[ctxId]) this.activeCharts[ctxId].destroy();
    const ctx = this.el(ctxId)?.getContext('2d');
    if (!ctx) return;

    const isDark = document.documentElement.classList.contains('dark');
    const textColor = isDark ? 'rgba(255, 255, 255, 0.8)' : 'rgba(0, 0, 0, 0.8)';

    const defaultOptions = { 
        responsive: true, 
        maintainAspectRatio: false, 
        plugins: { 
            legend: { 
                display: type === 'doughnut', 
                position: 'bottom',
                labels: {
                    color: textColor
                }
            } 
        }, 
        indexAxis: 'x',
        scales: {
            x: { 
                beginAtZero: true,
                ticks: { color: textColor },
                grid: { color: isDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.1)' }
            },
            y: { 
                beginAtZero: true,
                ticks: { color: textColor },
                grid: { color: isDark ? 'rgba(255, 255, 255, 0.1)' : 'rgba(0, 0, 0, 0.1)' }
            }
        }
    };

    const mergeOptions = (target, source) => {
        for (const key in source) {
            if (source[key] instanceof Object && key in target) {
                Object.assign(source[key], mergeOptions(target[key], source[key]));
            }
        }
        return Object.assign(target || {}, source);
    };

    const finalOptions = mergeOptions(defaultOptions, customOptions);

    this.activeCharts[ctxId] = new Chart(ctx, {
        type,
        data: { 
            labels, 
            datasets: [{ 
                label: 'Valor', 
                data, 
                backgroundColor: colors, 
                // LINHA CORRIGIDA PARA SER MAIS SEGURA:
                borderColor: Array.isArray(colors) ? colors.map(c => c.toString().replace(/, 0\.\d+\)/, ', 1)')) : colors,
                borderWidth: 1 
            }] 
        },
        options: finalOptions
    });
},

                tailwindColorToHex(twColor) {
                    const colorMap = { 'gray-400': '#9ca3af', 'blue-500': '#3b82f6', 'yellow-500': '#eab308', 'green-500': '#22c55e', 'purple-500': '#8b5cf6', 'pink-600': '#db2777' };
                    return colorMap[twColor.replace('bg-', '')] || '#000000';

                renderMarkdown(text) {
                    if (!text) return '';
                    // Processar **negrito** e *itálico*
                    text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>').replace(/\*(.*?)\*/g, '<em>$1</em>');
                    
                    const lines = text.split('\n');
                    let html = '';
                    let inList = false;

                    lines.forEach(line => {
                        // Processar cabeçalhos
                        if (line.startsWith('### ')) {
                            if (inList) { html += '</ul>'; inList = false; }
                            html += `<h3 class="text-xl font-bold text-gray-800 dark:text-gray-100 mt-4 mb-2">${line.substring(4)}</h3>`;
                        } else if (line.startsWith('#### ')) {
                            if (inList) { html += '</ul>'; inList = false; }
                            html += `<h4 class="text-lg font-semibold text-gray-700 dark:text-gray-200 mt-3 mb-1">${line.substring(5)}</h4>`;
                        }
                        // Processar itens de lista
                        else if (line.startsWith('- ')) {
                            if (!inList) {
                                html += '<ul class="list-disc list-inside space-y-1 my-2">';
                                inList = true;
                            }
                            html += `<li>${line.substring(2)}</li>`;
                        }
                        // Processar parágrafos normais
                        else {
                            if (inList) {
                                html += '</ul>';
                                inList = false;
                            }
                            if (line.trim() !== '') {
                                html += `<p class="my-2">${line}</p>`;
                            }
                        }
                    });

                    if (inList) {
                        html += '</ul>';
                    }

                    return html;
                },

                    return `
                        <div class="tooltip" style="width: 32px; height: 32px;">

                async handleAIGeneration(type, subjectId, topicId, button) {
                    const topic = this.findTopic(subjectId, topicId);
                    if (!topic || !topic.notes.trim()) {
                        this.renderFeedbackModal("Resumo Necessário", "Por favor, escreva ou cole seu resumo sobre o tópico na caixa de texto antes de usar a IA.");
                        return;
                    }

                    this.triggerSingleAchievement('first_ai');

                    let prompt;
                    let title = "Gerando Conteúdo...";
                    const tagContext = (topic.tags && topic.tags.length > 0) ? ` e as tags [${topic.tags.join(', ')}]` : '';

                    if (type === 'questions') {
                        title = "Gerando Questões...";
                        prompt = `${topic.aiPersona}. Baseado ÚNICA E EXCLUSIVAMENTE no resumo sobre o tópico "${this.getTopicText(topic)}"${tagContext}, ${topic.aiFocus}. O resumo é: "${topic.notes}". Retorne APENAS em formato JSON com um campo 'questions' que é uma lista. Cada item deve ter um campo 'type' ('multiple_choice' ou 'true_false'), 'item' (a pergunta), e 'justification'. Para 'multiple_choice', inclua 'options' (array de strings) e 'correctAnswerIndex' (número). Para 'true_false', inclua 'answer' ('Certo' ou 'Errado'). Exemplo: {"questions": [{"type": "true_false", "item": "...", "answer": "Certo", "justification": "..."}]}`;
                    } else if (type === 'flashcards') {
                        title = "Gerando Flashcards...";
                        prompt = `${topic.aiPersona}. Baseado ÚNICA E EXCLUSIVAMENTE no resumo sobre o tópico "${this.getTopicText(topic)}"${tagContext}, extraia os 5 conceitos mais importantes e crie flashcards para eles. O resumo é: "${topic.notes}". Retorne APENAS em formato JSON: {"flashcards": [{"front": "Termo/Conceito", "back": "Definição/Explicação"}, ...]}`;
                    } else { // explanation
                        title = "Aprofundando Explicação...";
                        prompt = `${topic.aiPersona}. Baseado ÚNICA E EXCLUSIVAMENTE no resumo sobre o tópico "${this.getTopicText(topic)}"${tagContext}, aprofunde a explicação sobre o tópico, mantendo o foco no conteúdo apresentado. O resumo é: "${topic.notes}". Retorne a explicação em texto simples formatado com Markdown (negrito).`;
                    }
                    
                    this.renderModal(title, '<div class="flex justify-center items-center h-40"><div class="spinner-sm" style="width:40px;height:40px;border-width:4px;"></div></div>');
                    const responseText = await this.callGeminiAPI(prompt, button);

                    if (responseText) {
                        if (type === 'questions' || type === 'flashcards') {
                            const cleanedJson = responseText.replace(/```json/g, '').replace(/```/g, '').trim();
                            try {
                                const data = JSON.parse(cleanedJson);
                                if (type === 'questions') this.renderQuizModal(subjectId, topic, data.questions);
                                else this.renderFlashcardsModal(data.flashcards);
                            } catch (e) {
                                console.error("JSON Parsing Error:", e, "Raw Text:", cleanedJson);

                        } else {
                            this.renderModal("Explicação Aprofundada", `<div class="prose prose-sm max-w-none dark:prose-invert">${this.renderMarkdown(responseText)}</div>`);
                        }
                    } else {
                       this.closeModal();
                    }
                },
                
                async callGeminiAPI(prompt, actionButton) {
                    const originalButtonContent = actionButton.innerHTML;
                    actionButton.innerHTML = '<div class="spinner-sm mx-auto"></div>';
                    actionButton.disabled = true;

                    try {
                        const callGeminiFunction = httpsCallable(functions, 'callGemini');
                        
                        const result = await callGeminiFunction({ prompt: prompt });

                        const text = result.data.response;
                        
                        if (!text) {
                            throw new Error("A Cloud Function retornou uma resposta vazia.");
                        }
                        
                        return text;

                    } catch (error) {
                        console.error("Erro ao chamar a Cloud Function:", error);
                        if (error.code === 'permission-denied') {
                             this.renderModal("Erro de Permissão", `<p class="text-red-500">Parece que há um problema de permissão para acessar a funcionalidade de IA. Isso pode acontecer se a Cloud Function não foi configurada para ser invocada publicamente. Por favor, verifique as permissões da função 'callGemini' no Google Cloud Console e garanta que 'allUsers' tenha a role 'Cloud Functions Invoker'.</p>`);
                        } else {
                             this.renderModal("Erro na IA", `<p class="text-red-500">Não foi possível conectar com o serviço de IA.<br><strong>Erro:</strong> ${error.message}</p>`);
                        }

                        actionButton.disabled = false;
                    }
                },

                updateTopicQuizHistory(subjectId, topicId, correct, total, feedback) {
                    const topic = this.findTopic(subjectId, topicId);
                    if (!topic) return;
                    if (!topic.quizHistory) topic.quizHistory = [];
                    
                    const newHistoryEntry = {
                        date: dayjs().tz("America/Sao_Paulo").toISOString(),
                        correct,
                        total,
                        performance: (correct / total) * 100,
                    };

                    if (feedback) {
                        newHistoryEntry.feedbackType = feedback.type;
                        newHistoryEntry.userFeedback = feedback.data;
                    }

                    topic.quizHistory.push(newHistoryEntry);
                    this.logActivity();
                },

                updateTopicICS(topic, performanceData) {
                    if (!topic) return;

                    // --- PASSO 1: CALCULAR OS IMPACTOS INICIAIS ---
                    const accuracy = performanceData.performance;

                    // A. Pontos da Performance (Impacto Quantitativo)
                    let performancePoints = 0;
                    if (accuracy >= 95) { performancePoints = 15; }
                    else if (accuracy >= 85) { performancePoints = 10; }
                    else if (accuracy >= 70) { performancePoints = 5; }
                    else if (accuracy >= 50) { performancePoints = -5; }
                    else { performancePoints = -10; }

                    // B. Ajuste do Feedback (Impacto Qualitativo)
                    let feedbackAdjustment = 0;
                    const feedback = performanceData.feedback;
                    if (feedback) {
                        if (feedback.type === 'confidence') {
                            if (feedback.data === 'total_domain') feedbackAdjustment = 3;
                            if (feedback.data === 'luck_or_easy_questions') feedbackAdjustment = -2;
                        } else if (feedback.type === 'autopsy' && feedback.data.reasons) {
                            if (feedback.data.reasons.includes('knowledge_gap')) feedbackAdjustment = -6;
                            else if (feedback.data.reasons.includes('concept_confusion')) feedbackAdjustment = -4;
                            else if (feedback.data.reasons.includes('interpretation_error')) feedbackAdjustment = -2;
                            else if (feedback.data.reasons.includes('carelessness')) feedbackAdjustment = -1;
                        }
                    }

                    let initialChange = performancePoints + feedbackAdjustment;

                    // --- PASSO 2: MODULAR A MUDANÇA TOTAL ---

                    // C. Modificador de Volatilidade (Consistência)
                    const history = topic.quizHistory.map(h => h.performance);
                    if (history.length >= 3) {
                        const lastThree = history.slice(-3);
                        const mean = lastThree.reduce((a, b) => a + b, 0) / lastThree.length;
                        const stdDev = Math.sqrt(lastThree.map(x => Math.pow(x - mean, 2)).reduce((a, b) => a + b, 0) / lastThree.length);

                        if (stdDev > 15) { // Alta volatilidade
                            initialChange *= 0.9;
                        } else if (stdDev < 10) { // Baixa volatilidade (consistência)
                            initialChange *= 1.1;
                        }
                    }

                    // D. Modificador de Esforço (IEM) - A ser implementado no futuro
                    // Por enquanto, não aplicaremos este modificador no ganho de ICS.

                    // --- PASSO FINAL: ATUALIZAR E SALVAR ---
                    const currentICS = topic.ics || 50; // Valor padrão de 50 se não existir
                    let newICS = currentICS + initialChange;
                    topic.ics = Math.max(0, Math.min(100, newICS)); // Garante que o ICS fique entre 0 e 100

                    console.log(`ICS Update for "${this.getTopicText(topic)}": Old=${currentICS.toFixed(1)}, Perf=${performancePoints}, Feed=${feedbackAdjustment}, Vol=${initialChange.toFixed(1)}, New=${topic.ics.toFixed(1)}`);

                    // Não chamamos saveData() aqui, pois ele será chamado pela função que invoca esta.
                },

                updateIEM(topic, review) {
                    if (!topic || !review) return;

                    const phaseGoals = {
                        2: { threshold: 80 }, 3: { threshold: 80 },
                        4: { threshold: 85 }, 5: { threshold: 85 }
                    };

                    let iemChange = 0;
                    const goal = phaseGoals[topic.phase];
                    const threshold = goal ? goal.threshold : 80;

                    if (review.performance < threshold) {
                        iemChange += 10;
                        if (review.performance < 50) {
                            iemChange += 5;
                        }
                        if (review.feedbackType === 'autopsy' && review.userFeedback && review.userFeedback.reasons) {
                            if (review.userFeedback.reasons.includes('conceptual_gap')) {
                                iemChange += 15;
                            }
                            if (review.userFeedback.reasons.includes('memory_failure')) {
                                iemChange += 5;
                            }
                        }
                    } else {
                        iemChange -= 5;
                    }

                    topic.iemScore = Math.max(0, (topic.iemScore || 0) + iemChange);
                },

                calculateAverageAccuracy(topic) {
                    if (!topic || !topic.quizHistory || topic.quizHistory.length === 0) {
                        return 0;
                    }

                    const totalCorrect = topic.quizHistory.reduce((sum, h) => sum + (h.correct || 0), 0);
                    const totalQuestions = topic.quizHistory.reduce((sum, h) => sum + (h.total || 0), 0);

                    return totalQuestions > 0 ? (totalCorrect / totalQuestions) * 100 : 0;
                },

                getTasks() {
                    const processedMissions = new Set();
                    const today = dayjs().tz("America/Sao_Paulo").startOf('day');
                    const tomorrow = today.add(1, 'day');
                    const next7DaysEnd = today.add(7, 'day');
                    
                    const tasks = { overdue: [], today: [], tomorrow: [], next7: [], future: {} };
                    if (!this.data || !this.data.subjects) return tasks;

                    this.data.subjects.forEach(s => {
                        s.topics.forEach(t => {
                            const item = { ...t, subjectName: s.name, subjectId: s.id };

                            // LÓGICA CORRIGIDA: Prioriza missões da IA
                            if (t.prescribedMission) {
                                const mission = t.prescribedMission;
                                const missionType = mission.type;

                                if (missionType === 'interleaved_practice' || missionType === 'synthesis_practice') {
                                    // Usar o timestamp como ID único para a missão
                                    const missionId = mission.prescribedDate.seconds; 
                                    if (!processedMissions.has(missionId)) {
                                        tasks.today.push({ ...item, isMultiTopicMission: true }); // Adiciona um marcador para o Passo 2
                                        processedMissions.add(missionId);
                                    }
                                    // Se a missão já foi processada, este tópico é ignorado, evitando duplicatas.
                                } else {
                                    // Lógica para missões de tópico único (reforço padrão) que não são do tipo avançado
                                    tasks.today.push({ ...item, taskType: `Reforço (IA)`, isPrescribed: true });
                                }
                            } else if (t.phase === 1) {
                                tasks.today.push({ ...item, taskType: 'Criar Resumo/Mapa' });
                            } else if (t.nextReviewDate && t.phase >= 2) {
                                const reviewDate = dayjs(t.nextReviewDate).startOf('day');
                                if (reviewDate.isBefore(today)) tasks.overdue.push(item);
                                else if (reviewDate.isSame(today)) tasks.today.push(item);
                                else if (reviewDate.isSame(tomorrow)) tasks.tomorrow.push(item);
                                else if (reviewDate.isAfter(tomorrow) && reviewDate.isSameOrBefore(next7DaysEnd)) tasks.next7.push(item);
                                else if (reviewDate.isAfter(next7DaysEnd)) {
                                    const monthYear = reviewDate.format('YYYY-MM');
                                    if (!tasks.future[monthYear]) tasks.future[monthYear] = [];
                                    tasks.future[monthYear].push(item);
                                }
                            }
                        });
                    });

                    // Ordenação (sem alteração)
                    const sorter = (a, b) => {
                        const dateA = dayjs(a.nextReviewDate);
                        const dateB = dayjs(b.nextReviewDate);
                        const dateDiff = dateA.diff(dateB);
                        if (dateDiff !== 0) return dateDiff;
                        return a.phase - b.phase;
                    };
                    tasks.overdue.sort(sorter);
                    tasks.today.sort((a, b) => a.phase - b.phase);

                    return tasks;
                },

                        </div>
                    `;
                    const footer = `<div class="flex justify-center"><button data-action="closeProgressWelcome" class="bg-teal-600 text-white font-bold px-6 py-2 rounded-lg hover:bg-teal-700">Entendi!</button></div>`;
                    
                    this.renderModal(title, content, footer, 'progress-welcome-modal');
                },

                // --- FASE 4: FUNÇÕES DA UI DE PROGRESSO ---

                renderProgressTab() {
                    const container = this.el('content-progress');
                    if (!container || !this.data) return;

                    this.renderProgressWelcomeModal();

                    container.innerHTML = `
                        <div class="space-y-8">
                            <div>
                                <h3 class="font-semibold text-lg mb-4 text-gray-800 dark:text-gray-200">
                                    <span class="tooltip">
                                        <span class="cursor-help border-b border-dashed border-gray-400">Seu Nível de Aprendizado</span>
                                        <span class="tooltiptext" style="text-align: left; width: 250px;">Esta seção mostra seu progresso geral no sistema. Ganhe XP ao completar tarefas e suba de nível para desbloquear novos títulos.</span>
                                    </span>
                                </h3>
                                <div>
                                    ${this.renderUserXPCard()}
                                </div>
                            </div>
                            <div>
                                <h3 class="font-semibold text-lg mb-4 text-gray-800 dark:text-gray-200">
                                   <span class="tooltip">
                                        <span class="cursor-help border-b border-dashed border-gray-400">Conquistas</span>
                                        <span class="tooltiptext" style="text-align: left; width: 250px;">Esta seção mostra os marcos que você alcançou. Conquistas desbloqueiam recompensas de XP e servem como um registro de suas vitórias.</span>
                                    </span>
                                </h3>
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    ${this.renderAchievementsSection()}
                                </div>
                            </div>
                        </div>
                    `;
                },

                renderUserXPCard() {
                    if (!this.data.hasOwnProperty('currentLevelIndex')) return '';

                    const levelIndex = this.data.currentLevelIndex;
                    const currentLevel = this.learningLevels[levelIndex];
                    const xpInLevel = this.data.currentXpInLevel;
                    const xpToNext = this.data.xpForNextLevel;
                    let progressPercent = 0;

                    if (xpToNext !== Infinity && xpToNext > 0) {
                        progressPercent = (xpInLevel / xpToNext) * 100;
                    } else if (xpToNext === Infinity) {
                        progressPercent = 100;
                    }
                    
                    return `
                        <div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-lg">
                        <div class="flex justify-between items-center mb-4">
    <!-- Esquerda: Nível -->
    <div class="text-left w-1/3">
        <p class="text-sm text-gray-500 dark:text-gray-400">Nível ${currentLevel.level}</p>
    </div>
    <!-- Centro: Nome do Nível -->
    <div class="text-center w-1/3">
        <div class="tooltip inline-block">
            <p class="font-bold text-2xl ${currentLevel.color} cursor-help">${currentLevel.name}</p>
            <span class="tooltiptext" style="text-align: left;">${currentLevel.desc}</span>
        </div>
    </div>
    <!-- Direita: XP Total -->
    <div class="text-right w-1/3">
        <p class="text-lg font-semibold text-gray-700 dark:text-gray-300">Total: ${this.data.totalXp} XP</p>
    </div>
</div>
                            <div class="w-full tooltip">
                                    <div class="flex justify-between text-sm font-medium text-gray-600 dark:text-gray-400 mb-1">
                                    <span>Progresso</span>
                                    <span>${xpInLevel} / ${xpToNext === Infinity ? 'MAX' : xpToNext} XP</span>
                                </div>
                                    <div class="w-full bg-gray-200 dark:bg-slate-700 rounded-full h-3 cursor-help">
                                        <div class="bg-[#5DBCD2] h-3 rounded-full" style="width: ${progressPercent}%"></div>
                                </div>
                                <span class="tooltiptext">${xpToNext === Infinity ? 'Nível Máximo Atingido!' : `Faltam ${xpToNext - xpInLevel} XP para o próximo nível.`}</span>
                            </div>
                                <div class="text-center mt-4 border-t dark:border-slate-700 pt-3">
                                    <button data-action="viewAllLevels" class="text-sm font-medium text-[#3B3A82] hover:text-[#2A3A8D] dark:text-[#5DBCD2] hover:underline">
                                    Ver todos os níveis
                                </button>
                                    <span class="mx-2 text-gray-300 dark:text-gray-600">|</span>
                                    <button data-action="viewAllAchievements" class="text-sm font-medium text-[#3B3A82] hover:text-[#2A3A8D] dark:text-[#5DBCD2] hover:underline">
                                    Ver Mural de Conquistas
                                </button>
                            </div>
                        </div>
                    `;
                },

                renderAchievementsSection() {
                    let html = '';

                    const categoryNames = {
                        consistency: 'Consistência',
                        volume: 'Volume',
                        performance: 'Performance',
                        engagement: 'Engajamento'
                    };

                    for (const categoryKey in this.achievementsConfig) {
                        html += `<div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-lg"><details class="group" open><summary class="font-semibold cursor-pointer py-2 text-gray-800 dark:text-gray-200">${categoryNames[categoryKey]}</summary><div class="space-y-4 pt-2">`;
                        
                        const category = this.achievementsConfig[categoryKey];
                        for (const achievementKey in category) {
                            const achievement = category[achievementKey];
                            
                            if (achievement.single) {
                                const isUnlocked = this.data.userAchievements.unlocked.includes(achievement.id);
                                html += `
                                    <div class="tooltip w-full">
                                        <div class="flex items-center p-3 rounded-lg ${isUnlocked ? 'bg-green-50 border-green-200 dark:bg-green-900/30 dark:border-green-800' : 'bg-gray-50 border-gray-200 dark:bg-slate-700 dark:border-slate-600'} border cursor-help">
                                            <div class="text-2xl mr-4">${isUnlocked ? '✅' : '🔒'}</div>
                                            <div>
                                                <p class="font-semibold ${isUnlocked ? 'text-green-800 dark:text-green-300' : 'text-gray-800 dark:text-gray-200'}">${achievement.name}</p>
                                                <p class="text-sm ${isUnlocked ? 'text-green-600 dark:text-green-400' : 'text-gray-500 dark:text-gray-400'}">${achievement.desc}</p>
                                            </div>
                                        </div>
                                        <span class="tooltiptext">${achievement.rarity} | +${achievement.xp} XP</span>
                                    </div>`;
                            } else if (achievement.levels) {
                                const progress = this.data.userAchievements[achievement.tracker] || 0;
                                
                                let nextLevel = null;
                                for (let i = 0; i < achievement.levels.length; i++) {
                                    const achievementId = `${achievement.id}_level_${i}`;
                                    if (!this.data.userAchievements.unlocked.includes(achievementId)) {
                                        nextLevel = achievement.levels[i];
                                        break;
                                    }
                                }

                                const progressPercent = nextLevel ? (progress / nextLevel.goal) * 100 : 100;
                                const isCompleted = !nextLevel;

                                html += `
                                    <div class="tooltip w-full">
                                        <div class="p-4 rounded-lg ${isCompleted ? 'bg-green-50 border-green-200 dark:bg-green-900/30 dark:border-green-800' : 'bg-gray-50 border-gray-200 dark:bg-slate-700 dark:border-slate-600'} border cursor-help">
                                            <p class="font-semibold ${isCompleted ? 'text-green-800 dark:text-green-300' : 'text-gray-800 dark:text-gray-200'} mb-2">${achievement.name}</p>
                                            <div class="w-full bg-gray-200 dark:bg-slate-600 rounded-full h-2.5">
                                                <div class="${isCompleted ? 'bg-green-500' : 'bg-[#5DBCD2]'} h-2.5 rounded-full" style="width: ${Math.min(100, progressPercent)}%"></div>
                                            </div>
                                            <div class="flex justify-between text-xs text-gray-500 dark:text-gray-400 mt-1">
                                                <span>${progress}</span>
                                                <span>${nextLevel ? nextLevel.goal : 'Completo!'}</span>
                                            </div>
                                        </div>
                                        <span class="tooltiptext">${nextLevel ? `${nextLevel.desc} (${nextLevel.rarity} | +${nextLevel.xp} XP)` : 'Todos os níveis desta conquista foram completados!'}</span>
                                    </div>`;
                            }
                        }
                        html += '</div></details></div>';
                    }

                    return html;
                },
                
                // --- FASE 5: FUNÇÕES DE FEEDBACK VISUAL ---
                
                showNotification(type, data) {
                    const container = this.el('notifications-container');
                    if (!container) return;

                    const id = `notif-${Date.now()}`;
                    let contentHTML = '';

                    if (type === 'xp_gain') {
                        contentHTML = `
                            <div class="flex items-center">
                                <span class="font-bold text-teal-500">+${data.amount} XP</span>
                            </div>
                        `;
                    } else if (type === 'achievement_unlocked') {
                        contentHTML = `
                            <div class="flex">
                                <div class="flex-shrink-0 text-2xl mr-3">🏆</div>
                                <div>
                                    <p class="font-bold text-yellow-600">Conquista Desbloqueada!</p>
                                    <p class="text-sm text-gray-700">${data.name}</p>
                                </div>
                            </div>
                        `;
                    }

                    const notification = document.createElement('div');
                    notification.id = id;
                    notification.className = 'notification bg-white p-4 rounded-lg shadow-lg max-w-sm';
                    notification.innerHTML = contentHTML;
                    
                    container.appendChild(notification);

                    // Forçar o navegador a aplicar a classe inicial antes de adicionar a classe de animação
                    setTimeout(() => {
                        notification.classList.add('show');
                    }, 10);

                    // Remover a notificação após alguns segundos
                    setTimeout(() => {
                        notification.classList.remove('show');
                        notification.classList.add('hide');
                        // Remover o elemento do DOM após a animação de saída
                        setTimeout(() => {
                            notification.remove();
                        }, 400); // Deve corresponder à duração da transição
                    }, 4000);
                },

                renderLevelUpModal(levelInfo) {
                    const title = "🚀 LEVEL UP! 🚀";
                    const content = `
                        <div class="text-center p-6">
                            <p class="text-lg text-gray-600 mb-2">Parabéns! Você alcançou um novo patamar:</p>
                            <h3 class="text-4xl font-bold ${levelInfo.color}">${levelInfo.name}</h3>
                            <p class="mt-2 text-gray-500">Nível ${levelInfo.level}</p>
                            <p class="mt-6 text-gray-700">Continue estudando para fortalecer ainda mais suas sinapses!</p>
                        </div>
                    `;
                    const footer = `<div class="flex justify-center"><button id="levelup-ok-btn" class="bg-teal-600 text-white font-bold px-6 py-2 rounded-lg">Continuar!</button></div>`;
                    this.renderModal(title, content, footer);
                    this.el('levelup-ok-btn').onclick = () => this.closeModal();
                },

                // --- Sidebar Logic ---
                initializeSidebar() {
                    const savedState = localStorage.getItem('sidebarState');
                    if (savedState === 'collapsed') {
                        this.sidebarCollapsed = true;
                        this.appContainer.classList.add('sidebar-collapsed');
                    }
                    this.updateSidebarAppearance();
                },

                toggleSidebar() {
                    this.sidebarCollapsed = !this.sidebarCollapsed;
                    this.appContainer.classList.toggle('sidebar-collapsed');
                    localStorage.setItem('sidebarState', this.sidebarCollapsed ? 'collapsed' : 'expanded');
                    this.updateSidebarAppearance();
                },

                updateSidebarAppearance() {
                    const toggleIcon = this.el('toggle-icon');
                    const toggleLabel = this.sidebarToggleBtn.querySelector('.text-label');
                    if (this.sidebarCollapsed) {
                        toggleLabel.textContent = ''; // Hide text by making it empty
                        toggleIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path>'; // Arrows pointing out
                        toggleIcon.classList.add('rotate-180');
                    } else {
                        toggleLabel.textContent = 'Recolher';
                        toggleIcon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path>'; // Arrows pointing in
                        toggleIcon.classList.remove('rotate-180');
                    }
                },

                toggleMobileSidebar() {
                    this.sidebar.classList.toggle('-translate-x-full');
                    this.sidebarBackdrop.classList.toggle('hidden');
                }


            };
            
            App.init();
            // ADICIONADO PARA TESTE: Permite chamar as funções do App pelo console
            window.myApp = App;
        });
    </script>
</body>
</html>
