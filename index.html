<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Sinapsy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
      darkMode: 'class'
    }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/utc.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/timezone.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/isToday.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/isSameOrBefore.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/isSameOrAfter.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/relativeTime.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/isoWeek.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/plugin/isBetween.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/locale/pt-br.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        html.dark body { background-color: #0f172a; }
        .modal, .modal-backdrop { transition: opacity 0.3s ease; }
        .modal-content { transition: transform 0.3s ease; }
        .tab-active { color: #0d9488; border-color: #14b8a6; }
        .tab-inactive { color: #6b7280; border-color: transparent; }
        .topic-row:hover { background-color: #f1f5f9; }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        .syllabus-subject-item.active { background-color: #f0f9ff; border-left-color: #5DBCD2; }
        .summary-textarea { width: 100%; border-radius: 8px; border: 1px solid #e2e8f0; padding: 8px; font-size: 14px; margin-top: 8px; resize: vertical; min-height: 120px; }
        .summary-textarea:focus { outline: none; border-color: #5DBCD2; box-shadow: 0 0 0 1px #5DBCD2; }
        .spinner-sm { border: 2px solid #f3f3f3; border-top: 2px solid #5DBCD2; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; }
        .btn-spinner { border-top-color: white; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .flashcard { perspective: 1000px; }
        .flashcard-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; }
        .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; padding: 20px; border-radius: 1rem; }
        .flashcard-back { transform: rotateY(180deg); }
        .details-arrow { transition: transform 0.2s; }
        details[open] > summary .details-arrow { transform: rotate(90deg); }
        #loading-overlay { display: flex; }
        .calendar-grid { display: grid; grid-template-columns: repeat(26, minmax(14px, 1fr)); grid-auto-flow: column; grid-template-rows: repeat(7, 1fr); gap: 3px; }
        .calendar-day { width: 14px; height: 14px; border-radius: 2px; }
        .tooltip { position: relative; display: inline-block; vertical-align: middle; }
        .tooltip .tooltiptext { visibility: hidden; width: max-content; max-width: 300px; background-color: #374151; color: #fff; text-align: left; border-radius: 6px; padding: 8px; position: absolute; z-index: 10; bottom: 125%; left: 50%; transform: translateX(-50%); opacity: 0; transition: opacity 0.3s; font-size: 12px; font-weight: normal; box-shadow: 0 2px 5px rgba(0,0,0,0.2); line-height: 1.5; }
        .dark .tooltip .tooltiptext { background-color: #1e293b; }
        .tooltip:hover .tooltiptext { visibility: visible; opacity: 1; }
        .filter-btn { transition: all 0.2s; }

        /* FASE 5: Estilos para as Notificações */
        #notifications-container .notification {
            transition: all 0.4s ease-in-out;
            opacity: 0;
            transform: translateX(100%);
            pointer-events: auto;
        }
        #notifications-container .notification.show {
            opacity: 1;
            transform: translateX(0);
        }
        #notifications-container .notification.hide {
            opacity: 0;
            transform: translateX(100%);
        }

        .dark .syllabus-subject-item.active {
            background-color: #1e293b; /* Cor de fundo slate-800 */
            border-left-color: #5DBCD2;
        }

        .dark .syllabus-subject-item.active span {
            color: #5DBCD2; /* Cor do texto teal-400 */
        }

        .phase-journey { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .phase-step { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 12px; }
        .phase-step.future { background-color: #e2e8f0; color: #475569; }
        .dark .phase-step.future { background-color: #334155; color: #94a3b8; }
        .phase-step.achieved { color: white; }
        .phase-separator { color: #9ca3af; }

        /* --- Cadernos Feature Styles --- */
        #cadernos-tabs-bar .tab-btn.active {
            border-bottom-color: #14b8a6; /* teal-500 */
            color: #0d9488; /* teal-600 */
            font-weight: 600;
        }
        .dark #cadernos-tabs-bar .tab-btn.active {
            border-bottom-color: #5eead4; /* teal-300 */
            color: #99f6e4; /* teal-200 */
        }
        #cadernos-topics-panel .topic-item.active {
            background-color: #f0f9ff; /* sky-50 */
            font-weight: 600;
            color: #0c4a6e; /* sky-900 */
        }
        .dark #cadernos-topics-panel .topic-item.active {
            background-color: #1e293b; /* slate-800 */
            color: #e2e8f0; /* slate-200 */
        }
        #content-cadernos.focus-mode #cadernos-topics-panel {
            display: none; /* O painel de tópicos some completamente */
        }

        #content-cadernos.focus-mode #cadernos-editor-panel {
            width: 100%;
            flex-grow: 1; /* Força o painel do editor a crescer e ocupar o espaço vertical */
        }
        #cadernos-dropdown-menu {
            position: absolute;
            right: 0;
            top: 100%;
            z-index: 20;
        }
    </style>
</head>
<body class="text-gray-800 dark:text-gray-200 transition-colors duration-300">

    <!-- Mobile Sidebar Backdrop -->
    <div id="sidebar-backdrop" class="fixed inset-0 bg-gray-900/50 dark:bg-gray-900/80 z-30 hidden md:hidden"></div>

    <!-- FASE 5: Contêiner para as notificações -->
    <div id="notifications-container" class="fixed top-5 right-5 z-[100] space-y-3 w-80 pointer-events-none"></div>

    <!-- Tela de Carregamento Global -->
    <div id="loading-overlay" class="fixed inset-0 bg-white dark:bg-slate-900 z-50 flex justify-center items-center transition-colors duration-300">
        <div class="text-center">
            <div class="spinner-sm mx-auto" style="width:40px; height:40px; border-width: 4px; border-top-color: #14b8a6;"></div>
            <p class="mt-4 text-gray-600 dark:text-gray-400 transition-colors duration-300">Aguarde...</p>
        </div>
    </div>

    <!-- TELA DE LOGIN / CADASTRO -->
    <div id="auth-container" class="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-slate-900 py-12 px-4 sm:px-6 lg:px-8 hidden transition-colors duration-300">
        <div class="max-w-md w-full space-y-8 p-10 bg-white dark:bg-slate-800 shadow-xl rounded-2xl transition-colors duration-300">
            <div>
                <div class="mx-auto h-14 w-auto flex justify-center">
                    <img src="assets/logo-dark-text.png" alt="Sinapsy Logo" class="h-14 w-auto block dark:hidden">
                    <img src="assets/logo-light-text.png" alt="Sinapsy Logo" class="h-14 w-auto hidden dark:block">
                </div>
                <h2 id="auth-title" class="mt-6 text-center text-3xl font-extrabold text-gray-900 dark:text-gray-100">Acesse sua conta</h2>
            </div>

            <form id="auth-form" class="mt-8 space-y-6">
                <div class="rounded-md shadow-sm -space-y-px">
                    <div>
                        <input id="auth-email" name="email" type="email" autocomplete="email" required class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-t-md focus:outline-none focus:ring-[#5DBCD2] focus:border-[#5DBCD2] focus:z-10 sm:text-sm dark:bg-slate-700 dark:border-slate-600 dark:placeholder-gray-400 dark:text-white transition-colors duration-300" placeholder="Endereço de e-mail">
                    </div>
                    <div>
                        <input id="auth-password" name="password" type="password" autocomplete="current-password" required class="appearance-none rounded-none relative block w-full px-3 py-2 border border-gray-300 placeholder-gray-500 text-gray-900 rounded-b-md focus:outline-none focus:ring-[#5DBCD2] focus:border-[#5DBCD2] focus:z-10 sm:text-sm dark:bg-slate-700 dark:border-slate-600 dark:placeholder-gray-400 dark:text-white transition-colors duration-300" placeholder="Senha">
                    </div>
                </div>
                <div class="flex items-center justify-end text-sm">
                    <button type="button" id="forgot-password-btn" class="font-medium text-gray-500 hover:text-[#5DBCD2] dark:text-gray-400 dark:hover:text-[#5DBCD2]">
                        Esqueceu sua senha?
                    </button>
                </div>
                <button id="auth-submit-btn" type="submit" class="group relative w-full flex justify-center items-center py-2 px-4 border border-transparent text-sm font-medium rounded-md text-white bg-[#3B3A82] hover:bg-[#2A3A8D] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#5DBCD2]" style="min-height: 38px;">
                    <span class="btn-text">Entrar</span>
                    <div class="spinner-sm btn-spinner hidden"></div>
                </button>
            </form>
            <p id="auth-toggle-text" class="mt-2 text-center text-sm text-gray-600 dark:text-gray-400">
                Ainda não é aluno? <a href="/pagina-de-vendas.html" class="font-medium text-[#3B3A82] hover:text-[#2A3A8D] dark:hover:text-[#5DBCD2]">Assine agora</a>
            </p>
            <p id="auth-error" class="mt-2 text-center text-sm text-red-600" style="min-height: 20px;"></p>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL DO PAINEL -->
    <div id="app-container" class="hidden h-screen flex bg-gray-50 dark:bg-slate-900 group transition-colors duration-300">
        <!-- Sidebar -->
        <aside id="sidebar" class="w-64 bg-white border-r border-gray-200 dark:bg-slate-800 dark:border-slate-700 flex-col flex-shrink-0 transition-all duration-300 ease-in-out fixed inset-y-0 left-0 z-40 transform -translate-x-full md:relative md:translate-x-0 md:flex md:group-[.sidebar-collapsed]:w-20">
            <!-- Sidebar Header -->
            <div class="p-5 border-b border-gray-200 dark:border-slate-700 flex-shrink-0 group-[.sidebar-collapsed]:p-3 transition-colors duration-300 flex justify-center items-center">
                <a href="#" id="logo-link" class="group-[.sidebar-collapsed]:hidden flex flex-col items-center cursor-pointer">
                    <img src="assets/logo-dark-text.png" alt="Sinapsy Logo" class="h-14 w-auto block dark:hidden">
                    <img src="assets/logo-light-text.png" alt="Sinapsy Logo" class="h-14 w-auto hidden dark:block">
                </a>
            </div>

            <!-- Navigation -->
            <nav id="sidebar-nav" class="flex-grow p-4 space-y-1 overflow-y-auto group-[.sidebar-collapsed]:p-2">
                <button data-tab-id="planner" class="sidebar-item w-full text-left flex items-center gap-3 px-3 py-2 rounded-lg font-medium text-base group-[.sidebar-collapsed]:justify-center transition-colors duration-200">
                    <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <span class="text-label group-[.sidebar-collapsed]:hidden">Planejador</span>
                </button>
                <button data-tab-id="study-plan" class="sidebar-item w-full text-left flex items-center gap-3 px-3 py-2 rounded-lg font-medium text-base group-[.sidebar-collapsed]:justify-center transition-colors duration-200">
                    <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                    <span class="text-label group-[.sidebar-collapsed]:hidden">Plano de Estudos</span>
                </button>
                <button data-tab-id="cadernos" class="sidebar-item w-full text-left flex items-center gap-3 px-3 py-2 rounded-lg font-medium text-base group-[.sidebar-collapsed]:justify-center transition-colors duration-200">
                    <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    <span class="text-label group-[.sidebar-collapsed]:hidden">Cadernos</span>
                </button>
                <button data-tab-id="syllabus-editor" class="sidebar-item w-full text-left flex items-center gap-3 px-3 py-2 rounded-lg font-medium text-base group-[.sidebar-collapsed]:justify-center transition-colors duration-200">
                    <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                    <span class="text-label group-[.sidebar-collapsed]:hidden">Editor de Edital</span>
                </button>
                <button data-tab-id="dashboard" class="sidebar-item w-full text-left flex items-center gap-3 px-3 py-2 rounded-lg font-medium text-base group-[.sidebar-collapsed]:justify-center transition-colors duration-200">
                    <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0h10"></path></svg>
                    <span class="text-label group-[.sidebar-collapsed]:hidden">Dashboard</span>
                </button>
                <button data-tab-id="progress" class="sidebar-item w-full text-left flex items-center gap-3 px-3 py-2 rounded-lg font-medium text-base group-[.sidebar-collapsed]:justify-center transition-colors duration-200">
                   <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    <span class="text-label group-[.sidebar-collapsed]:hidden">Progresso</span>
                </button>
                <button data-tab-id="sinapsy-ia" class="sidebar-item w-full text-left flex items-center gap-3 px-3 py-2 rounded-lg font-medium text-base group-[.sidebar-collapsed]:justify-center transition-colors duration-200">
                    <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    <span class="text-label group-[.sidebar-collapsed]:hidden">Sinapsy IA</span>
                </button>
                <button data-tab-id="synaptic-map" class="sidebar-item w-full text-left flex items-center gap-3 px-3 py-2 rounded-lg font-medium text-base group-[.sidebar-collapsed]:justify-center transition-colors duration-200">
                    <svg class="w-6 h-6 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14a2 2 0 100-4 2 2 0 000 4z"></path></svg>
                    <span class="text-label group-[.sidebar-collapsed]:hidden">Mapa Sináptico</span>
                </button>
            </nav>

            <!-- Sidebar Footer (User Info) -->
            <div id="user-info" class="p-4 border-t border-gray-200 dark:border-slate-700 flex-shrink-0 transition-colors duration-300">
                <p class="text-sm text-gray-700 dark:text-gray-300 truncate group-[.sidebar-collapsed]:hidden">Utilizador: <span id="user-email" class="font-semibold"></span></p>
                <div class="mt-2 space-y-2 group-[.sidebar-collapsed]:hidden">
                    <button id="logout-btn" class="w-full text-sm bg-gray-200 hover:bg-gray-300 text-gray-800 dark:bg-slate-700 dark:hover:bg-slate-600 dark:text-gray-200 font-medium py-2 px-3 rounded-lg transition-colors duration-200">Sair</button>
                </div>
                <div class="mt-2 border-t border-gray-200 dark:border-slate-700 pt-2">
                    <button id="theme-toggle-btn" class="w-full flex items-center justify-center text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 dark:bg-slate-700 dark:hover:bg-slate-600 dark:text-gray-300 font-medium py-2 px-3 rounded-lg transition-colors duration-200">
                        <svg id="theme-toggle-dark-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                        <svg id="theme-toggle-light-icon" class="w-5 h-5 hidden" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 14.95l.707-.707a1 1 0 10-1.414-1.414l-.707.707a1 1 0 001.414 1.414zM5 11a1 1 0 100-2H3a1 1 0 100 2h2zM3.464 3.464l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414z"></path></svg>
                        <span class="text-label ml-2 group-[.sidebar-collapsed]:hidden">Tema</span>
                    </button>
                    <button id="sidebar-toggle-btn" class="mt-2 w-full flex items-center justify-center text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 dark:bg-slate-700 dark:hover:bg-slate-600 dark:text-gray-300 font-medium py-2 px-3 rounded-lg transition-colors duration-200">
                        <svg id="toggle-icon" class="w-5 h-5 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"></path></svg>
                        <span class="text-label ml-2 group-[.sidebar-collapsed]:hidden">Recolher</span>
                    </button>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-6 overflow-y-auto h-screen transition-all duration-300 dark:bg-slate-900">
            <!-- Main Header - for general buttons -->
            <div class="flex justify-between items-center gap-4 mb-6">
                 <button id="hamburger-btn" class="p-1 rounded-md text-gray-500 hover:bg-gray-200 dark:text-gray-400 dark:hover:bg-slate-700 md:hidden transition-colors duration-200">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="flex items-center gap-4 flex-grow justify-end">
                    
                    <div id="xp-header-component" class="flex-grow flex items-center justify-end gap-3" title="">
                        <span id="xp-level-name" class="text-sm font-bold text-gray-700 dark:text-gray-200"></span>
                        <div class="w-32 bg-gray-200 dark:bg-slate-700 rounded-full h-2.5">
                            <div id="xp-progress-bar" class="bg-teal-500 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                        </div>
                        <span id="xp-level-text" class="text-sm font-medium text-gray-600 dark:text-gray-400"></span>
                    </div>
                    <button id="learning-phases-btn" class="text-sm font-medium text-[#3B3A82] hover:text-[#2A3A8D] dark:text-[#5DBCD2] dark:hover:text-[#63D2E5] transition-colors duration-200">Ver Fases do Aprendizado</button>
                    <button id="reset-progress-btn" class="bg-red-100 text-red-700 border-red-200 px-4 py-2 rounded-lg hover:bg-red-200 transition-colors text-sm font-medium dark:bg-red-900/50 dark:text-red-400 dark:border-red-800 dark:hover:bg-red-900">Resetar Progresso</button>
                </div>
            </div>

            <!-- Content Panels -->
            <div id="main-content" class="h-full">
                <div id="content-planner" class="hidden">

                init() {
                    this.el = (id) => document.getElementById(id);
                    this.cacheElements();
                    this.attachEventListeners();
                    // this.startClock();
                    this.setupAuthListener();
                    this.initializeSidebar();
                    this.initializeTheme();
                    this.checkForPlanParameter();

                    window.addEventListener('resize', this.debounce(() => {
                        if (this.el('content-cadernos') && !this.el('content-cadernos').classList.contains('hidden')) {
                            this.renderCadernosTabs();
                        }
                    }, 200));

                    document.addEventListener('click', (e) => {
                        const dropdownMenu = this.el('cadernos-dropdown-menu');
                        const dropdownBtn = this.el('cadernos-dropdown-btn');
                        if (dropdownMenu && !dropdownMenu.classList.contains('hidden')) {
                            if (!dropdownBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
                                dropdownMenu.classList.add('hidden');
                            }
                        }
                    });
                },

                debounce(func, wait) {
                    let timeout;
                    return function executedFunction(...args) {
                        const later = () => {
                            clearTimeout(timeout);
                            func(...args);
                        };
                        clearTimeout(timeout);
                        timeout = setTimeout(later, wait);
                    };
                },

                checkForPlanParameter() {
                    const urlParams = new URLSearchParams(window.location.search);
                    const plan = urlParams.get('plano');
                    if (plan) {
                        const checkoutModal = this.el('checkout-modal-container');
                        if (checkoutModal) {
                            checkoutModal.classList.remove('hidden');
                        }
                    }
                },
                
                applyTheme(theme) {
                    const darkIcon = this.el('theme-toggle-dark-icon');
                    const lightIcon = this.el('theme-toggle-light-icon');
                    
                    if (theme === 'dark') {
                        document.documentElement.classList.add('dark');
                        if (darkIcon) darkIcon.classList.remove('hidden');
                        if (lightIcon) lightIcon.classList.add('hidden');
                    } else {
                        document.documentElement.classList.remove('dark');
                        if (darkIcon) darkIcon.classList.add('hidden');
                        if (lightIcon) lightIcon.classList.remove('hidden');
                    }
                },

                applyUserTheme() {
                    const userTheme = localStorage.getItem('theme') || 'dark';
                    this.applyTheme(userTheme);
                },
                
                initializeTheme() {
                    const themeToggleBtn = this.el('theme-toggle-btn');
                    this.applyUserTheme();

                    themeToggleBtn.addEventListener('click', () => {
                        const newTheme = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
                        localStorage.setItem('theme', newTheme);
                        this.applyTheme(newTheme);
                    });
                },
                
                // FASE 1: O "MOTOR" DO SISTEMA DE XP
                addXp(amount) {
                    if (!this.data || isNaN(amount) || amount <= 0) return;

                    this.data.totalXp += amount;
                    this.data.currentXpInLevel += amount;

                    this.showNotification('xp_gain', { amount });

                    this.checkLevelUp();
                    this.renderXpHeader(); // <-- ADICIONAR ESTA LINHA
                    
                    this.saveData(); 
                },

                checkLevelUp() {
                    const currentLevelIndex = this.data.currentLevelIndex;
                    
                    if (currentLevelIndex >= this.learningLevels.length - 1) return;

                    while (this.data.currentXpInLevel >= this.data.xpForNextLevel) {
                        const newLevelIndex = this.data.currentLevelIndex + 1;
                        const newLevel = this.learningLevels[newLevelIndex];

                        if (!newLevel) break;

                        this.data.currentXpInLevel -= this.data.xpForNextLevel;
                        this.data.currentLevelIndex = newLevelIndex;
                        this.data.xpForNextLevel = newLevel.xpToNext;

                        // Dispara uma chuva de confetes para celebrar
                        if (window.confetti) {
                            confetti({
                                particleCount: 150,
                                spread: 90,
                                origin: { y: 0.6 }
                            });
                        }
                        this.renderLevelUpModal(newLevel);
                    }
                },

                renderXpHeader() {
                    if (!this.data || !this.data.hasOwnProperty('currentLevelIndex')) return;

                    const levelIndex = this.data.currentLevelIndex;
                    const currentLevel = this.learningLevels[levelIndex];
                    
                    // Verificação de segurança crucial
                    if (!currentLevel) {
                        console.error(`Nível inválido encontrado para o usuário: index ${levelIndex}`);
                        return; 
                    }

                    const nextLevel = this.learningLevels[levelIndex + 1];
                    const xpInLevel = this.data.currentXpInLevel;
                    const xpToNext = this.data.xpForNextLevel;

                    let progressPercent = 0;
                    if (xpToNext !== Infinity && xpToNext > 0) {
                        progressPercent = (xpInLevel / xpToNext) * 100;
                    } else {
                        progressPercent = 100;
                    }

                    this.el('xp-level-name').textContent = `Nível ${currentLevel.level}: ${currentLevel.name}`;
                    this.el('xp-progress-bar').style.width = `${progressPercent}%`;
                    this.el('xp-level-text').textContent = `${xpInLevel} / ${xpToNext === Infinity ? 'MAX' : xpToNext} XP`;

                    const tooltipText = `Nível Atual: ${currentLevel.name}\n${currentLevel.desc}\n\n` +
                                      (nextLevel ? `Próximo Nível: ${nextLevel.name}\nFaltam ${xpToNext - xpInLevel} XP.` : 'Nível Máximo Atingido!');
                    this.el('xp-header-component').setAttribute('title', tooltipText);
                },

                // FASE 3: LÓGICA DAS CONQUISTAS
                updateAchievementProgress(trackerId, value) {
                    if (!this.data || !this.data.userAchievements || !value) return;

                    this.data.userAchievements[trackerId] = (this.data.userAchievements[trackerId] || 0) + value;
                    this.checkLeveledAchievements();
                    this.saveData();
                },

                triggerSingleAchievement(achievementId) {
                    if (!this.data || !this.data.userAchievements || this.data.userAchievements.unlocked.includes(achievementId)) {
                        return; // Se não houver dados ou a conquista já foi desbloqueada, não faz nada
                    }

                    let achievementConfig = null;
                    for (const categoryKey in this.achievementsConfig) {
                        const category = this.achievementsConfig[categoryKey];
                        if (category[achievementId]) {
                            achievementConfig = category[achievementId];
                            break;
                        }
                    }

                    if (achievementConfig) {
                        this.showNotification('achievement_unlocked', achievementConfig);
                        this.addXp(achievementConfig.xp); // Adiciona o XP, que já chama saveData()
                        this.data.userAchievements.unlocked.push(achievementId);
                        // O saveData() já é chamado pelo addXp, mas uma chamada extra garante a consistência do array unlocked
                        this.saveData(); 
                    }
                },

                checkLeveledAchievements() {
                    if (!this.data || !this.data.userAchievements) return;

                    for (const categoryKey in this.achievementsConfig) {
                        const category = this.achievementsConfig[categoryKey];
                        for (const achievementKey in category) {
                            const achievement = category[achievementKey];
                            if (achievement.levels && achievement.tracker) {
                                const progress = this.data.userAchievements[achievement.tracker] || 0;
                                
                                achievement.levels.forEach((level, index) => {
                                    const achievementId = `${achievement.id}_level_${index}`;
                                    const isUnlocked = this.data.userAchievements.unlocked.includes(achievementId);

                                    if (!isUnlocked && progress >= level.goal) {
                                        const achievementData = { ...level, name: achievement.name };
                                        this.showNotification('achievement_unlocked', achievementData);
                                        this.addXp(level.xp);
                                        this.data.userAchievements.unlocked.push(achievementId);
                                    }
                                });
                            }
                        }
                    }
                    // A chamada saveData é feita pelo addXp, que é chamado se uma conquista for desbloqueada.
                },

                // CORREÇÃO: Função para calcular e salvar o progresso de consistência
                updateConsistencyAchievements() {
                    if (!this.data || !this.data.activityLog || !this.data.userAchievements) return;

                    const today = dayjs().tz("America/Sao_Paulo");
                    const uniqueDates = [...new Set(this.data.activityLog.map(log => log.date))].sort();
                    
                    // --- Cálculo da Ofensiva (Streak) ---
                    let currentStreak = 0;
                    if (uniqueDates.length > 0) {
                        let checkDate = today;
                        // Se não estudou hoje, a ofensiva só conta se estudou ontem
                        if (!uniqueDates.includes(checkDate.format('YYYY-MM-DD'))) {
                            checkDate = today.subtract(1, 'day');
                        }
                        
                        // Loop reverso para contar dias consecutivos
                        for (let i = uniqueDates.length - 1; i >= 0; i--) {
                            if (dayjs(uniqueDates[i]).isSame(checkDate, 'day')) {
                                currentStreak++;
                                checkDate = checkDate.subtract(1, 'day');
                            } else {
                                // Se a data no log não for a que estamos verificando, a sequência quebra.
                                // Mas precisamos verificar se a data do log é anterior à data que estamos verificando
                                // para evitar que um buraco no histórico quebre a contagem incorretamente.
                                if (dayjs(uniqueDates[i]).isBefore(checkDate, 'day')) {
                                    break;
                                }
                            }
                        }
                    }
                    
                    // --- Cálculo do Estudo no Fim de Semana ---
                    let weekendStreak = 0;
                    const weekendStudyWeeks = [...new Set(
                        uniqueDates
                            .map(dateStr => dayjs(dateStr))
                            .filter(d => d.day() === 6 || d.day() === 0) // 6 = Sábado, 0 = Domingo
                            .map(d => d.isoWeek())
                    )].sort((a, b) => a - b);

                    if (weekendStudyWeeks.length > 0) {
                        let currentWeekendStreak = 1;
                        for (let i = weekendStudyWeeks.length - 1; i > 0; i--) {
                            // Verifica se a semana atual é exatamente 1 a menos que a anterior
                            if (weekendStudyWeeks[i] === weekendStudyWeeks[i - 1] + 1) {
                                currentWeekendStreak++;
                            } else {
                                break; // Sequência quebrada
                            }
                        }
                        weekendStreak = currentWeekendStreak;
                    }

                    // Garante que max_streak exista antes de comparar
                    if (this.data.userAchievements.max_streak === undefined) {
                        this.data.userAchievements.max_streak = 0;
                    }

                    // Se a ofensiva atual for maior que o recorde, atualiza o recorde.
                    if (currentStreak > this.data.userAchievements.max_streak) {
                        this.data.userAchievements.max_streak = currentStreak;
                    }

                    // Atualiza os dados se houver mudança
                    const needsUpdate = this.data.userAchievements.current_streak !== currentStreak || this.data.userAchievements.weekend_studies !== weekendStreak;
                    
                    if (needsUpdate) {
                        this.data.userAchievements.current_streak = currentStreak;
                        this.data.userAchievements.weekend_studies = weekendStreak;
                        this.checkLeveledAchievements(); // Verifica se as novas contagens desbloqueiam algo
                        this.saveData();
                    }
                },

                async loadData() {
                    if (this.unsubscribeFirestore) this.unsubscribeFirestore();
                    const docRef = doc(db, "study_plans", this.userId);

                    const docSnap = await getDoc(docRef);

                    if (!docSnap.exists()) {
                        console.log("Nenhum documento encontrado, criando dados iniciais...");
                        this.resetData(false);
                        await setDoc(docRef, this.data);
                    }

                    this.unsubscribeFirestore = onSnapshot(docRef, (snapshot) => {
                        this.data = snapshot.data();
                        
                        let needsUpdate = false;
                        if (this.data.totalXp === undefined) {
                            this.data.totalXp = 0;
                            this.data.currentLevelIndex = 0;
                            this.data.currentXpInLevel = 0;
                            this.data.xpForNextLevel = this.learningLevels[0].xpToNext;
                            needsUpdate = true;
                        }
                        if (this.data.userAchievements === undefined) {
                            this.data.userAchievements = {
                                questions_solved: 0,
                                summaries_created: 0,
                                current_streak: 0,
                                weekend_studies: 0, 
                                unlocked: []
                            };
                            needsUpdate = true;
                        }
                        
                        if (this.data.userAchievements.weekend_studies === undefined) {
                            this.data.userAchievements.weekend_studies = 0;
                            needsUpdate = true;
                        }

                        if (needsUpdate) {
                            this.saveData();
                        }
                        
                        this.updateConsistencyAchievements(); 
                        
                        if (this.data && !this.data.hasSeenWelcome) {
                            this.renderWelcomeModal();
                        }

                        this.renderXpHeader(); // <-- ADICIONAR ESTA LINHA
                        this.renderAll();
                    }, (error) => {
                        console.error("Erro ao carregar dados do Firestore:", error);
                    });
                },

                async saveData() {
                    if (!this.data || !this.userId) return;
                    
                    const docRef = doc(db, "study_plans", this.userId);
                    try {
                        await setDoc(docRef, this.data, { merge: true });
                    } catch (e) {
                        console.error("Falha ao guardar dados no Firestore:", e);
                    }

                        console.error('Erro de Autenticação:', error.code);
                        let message = 'Ocorreu um erro. Tente novamente.';
                        switch (error.code) {
                            case 'auth/invalid-credential':
                            case 'auth/wrong-password':
                            case 'auth/user-not-found':
                            case 'auth/invalid-login-credentials': message = 'E-mail ou senha inválidos.'; break;
                        }

                        btnSpinner.classList.add('hidden');
                        btnText.classList.remove('hidden');
                        this.authSubmitBtn.disabled = false;
                    }

                async handleLogout() {
                    try {
                        await signOut(auth);
                    } catch (error) {
                        console.error('Erro ao sair:', error);
                    }
                },

                renderForgotPasswordModal() {
                    const title = "Recuperar Senha";
                    const content = `
                        <p class="text-sm text-gray-600 dark:text-gray-400 mb-4">
                            Digite seu endereço de e-mail abaixo. Se uma conta estiver associada a ele, enviaremos um link para redefinir sua senha.
                        </p>
                        <form id="forgot-password-form">
                            <div>
                                <label for="email-for-reset" class="block text-sm font-medium text-gray-700 dark:text-gray-300">E-mail</label>
                                <input type="email" id="email-for-reset" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-teal-500 focus:border-teal-500 sm:text-sm dark:bg-slate-700 dark:border-slate-600 dark:text-gray-200">
                            </div>
                            <p id="reset-feedback" class="text-sm mt-3" style="min-height: 20px;"></p>
                        </form>
                    `;
                    const footer = `
                        <div class="flex justify-end">
                            <button id="send-reset-link-btn" class="bg-teal-600 text-white px-4 py-2 rounded-lg hover:bg-teal-700 flex items-center justify-center" style="min-width: 120px;">
                                <span class="btn-text">Enviar Link</span>
                                <div class="spinner-sm btn-spinner hidden"></div>
                            </button>
                        </div>
                    `;
                    this.renderModal(title, content, footer, 'forgot-password-modal');

                    const form = this.el('forgot-password-form');
                    const sendButton = this.el('send-reset-link-btn');
                    const feedbackEl = this.el('reset-feedback');

                    const handleSubmit = async (e) => {
                        if(e) e.preventDefault();
                        
                        const email = this.el('email-for-reset').value;
                        if (!email) {
                            feedbackEl.textContent = 'Por favor, insira um e-mail.';
                            feedbackEl.className = 'text-sm mt-3 text-red-500';
                            return;
                        }

                        const btnText = sendButton.querySelector('.btn-text');
                        const btnSpinner = sendButton.querySelector('.btn-spinner');
                        
                        btnText.classList.add('hidden');
                        btnSpinner.classList.remove('hidden');
                        sendButton.disabled = true;
                        feedbackEl.textContent = '';

                        try {
                            await sendPasswordResetEmail(auth, email);
                            feedbackEl.textContent = 'Link enviado! Verifique sua caixa de entrada (e a pasta de spam).';
                            feedbackEl.className = 'text-sm mt-3 text-green-500 dark:text-green-400';
                            this.el('email-for-reset').disabled = true;
                            // Hide button after success
                            sendButton.style.display = 'none';
                        } catch (error) {
                            console.error("Erro ao enviar e-mail de redefinição:", error.code);
                            let message = "Ocorreu um erro. Tente novamente.";
                            // To prevent user enumeration, we show a generic success message even if the user is not found.
                            if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-email') {
                                message = 'Se este e-mail estiver cadastrado, um link de recuperação foi enviado.';
                                feedbackEl.className = 'text-sm mt-3 text-green-500 dark:text-green-400';
                            } else {
                                message = 'Ocorreu um erro ao processar sua solicitação. Tente novamente mais tarde.';
                                feedbackEl.className = 'text-sm mt-3 text-red-500 dark:text-red-400';
                            }
                            feedbackEl.textContent = message;
                        } finally {
                            btnSpinner.classList.add('hidden');
                            btnText.classList.remove('hidden');
                            // Only re-enable the button if it wasn't a success-like message
                            if (feedbackEl.className.includes('red')) {
                                sendButton.disabled = false;
                            }
                        }
                    };

                    sendButton.addEventListener('click', handleSubmit);
                    form.addEventListener('submit', handleSubmit);
                },
                

                getTopicText(topic) {
                    if (!topic || !topic.text) return '';
                    return topic.text?.text || topic.text;
                },

                findTopic(subjectId, topicId) {
                    const subject = this.data.subjects.find(s => s.id === subjectId);
                    return subject ? subject.topics.find(t => t.id === topicId) : null;
                },
                
                updatePhase(topic, newPhase) {
                    topic.phase = newPhase;
                    topic.phaseHistory.push({ phase: newPhase, date: dayjs().tz("America/Sao_Paulo").format('YYYY-MM-DD') });
                    this.logActivity();
                },
                
                handleTopicAction(action, subjectId, topicId, target) {
                    if (action === 'goToPlanner') {
                        this.closeModal();
                        document.querySelector('button[data-tab-id="planner"]').click();
                        return;
                    }
                    
                    const topic = this.findTopic(subjectId, topicId);
                    if (!topic) return;
                    
                    let shouldCloseModal = false;

                    const actions = {
                        'setHasMaterial': () => {
                             this.updatePhase(topic, 2);
                             topic.nextReviewDate = dayjs().tz("America/Sao_Paulo").add(1, 'day').format('YYYY-MM-DD');
                        },
                        'setNeedsMaterial': () => this.updatePhase(topic, 1),
                        'completeConstruction': () => {
                            topic.taskStatus.mapReady = target.checked;
                            if (target.checked) {
                                if (topic.phase === 1) { // Garante que o XP seja dado apenas uma vez
                                    this.addXp(5);
                                    this.triggerSingleAchievement('first_summary');
                                    this.updateAchievementProgress('summaries_created', 1);
                                }
                                this.updatePhase(topic, 2);
                                topic.nextReviewDate = dayjs().tz("America/Sao_Paulo").add(1, 'day').format('YYYY-MM-DD');
                            }
                        },
                        'savePerformance': () => this.handlePerformance(subjectId, topicId),
                        'saveNote': () => { topic.notes = target.value; this.saveData(); },
                        'generateQuestions': async () => await this.handleAIGeneration('questions', subjectId, topicId, target),
                        'generateFlashcards': async () => await this.handleAIGeneration('flashcards', subjectId, topicId, target),
                        'deepenExplanation': async () => await this.handleAIGeneration('explanation', subjectId, topicId, target),
                        'editAIConfig': () => this.renderAIConfigModal(subjectId, topicId),
                        'expandNotes': () => this.renderExpandedNotesModal(subjectId, topicId),
                        'scheduleManually': () => {
                            this.closeModal();
                            this.renderCustomDateModal(subjectId, topicId, true);
                        }
                    };

                    if (actions[action]) {
                        actions[action]();
                        if(!['saveNote', 'editAIConfig', 'expandNotes', 'scheduleManually'].includes(action)) this.saveData();
                        
                        if (shouldCloseModal) this.closeModal();
                        
                        // Atualização em tempo real da aba de progresso
                        if (this.el('content-progress') && !this.el('content-progress').classList.contains('hidden')) {
                            if(action === 'completeConstruction') {
                                this.renderProgressTab();
                            }
                        }
                        
                        if(!['editAIConfig', 'expandNotes', 'scheduleManually'].includes(action)) this.renderAll();
                        
                        if (action === 'setHasMaterial' || action === 'setNeedsMaterial' || action === 'completeConstruction') {
                           this.renderTopicsModal(subjectId, topicId);
                        }
                    }
                },
                
                handleSyllabusAction(action, subjectId, topicId) {
                    const actions = {
                        'addSubject': () => this.handleAddSubject(),
                        'addFromLibrary': () => this.renderLibraryModal(),
                        'editSubject': () => this.handleEditSubject(subjectId),
                        'deleteSubject': () => this.handleDeleteSubject(subjectId),
                        'addTopic': () => this.handleAddTopic(subjectId),
                        'bulkAddTopics': () => this.handleBulkAddTopics(subjectId),
                        'editTopic': () => this.handleEditTopic(subjectId, topicId),
                        'deleteTopic': () => this.handleDeleteTopic(subjectId, topicId),
                        'selectSubject': () => this.renderSyllabusTopics(subjectId),
                    };
                    if (actions[action]) actions[action]();
                },

                                        <input type="checkbox" class="h-5 w-5 rounded border-gray-300 text-teal-600 focus:ring-teal-500 library-syllabus-checkbox" data-syllabus-id="${syllabus.id}">
                                        <span class="ml-3 font-semibold text-gray-800 dark:text-gray-100">${syllabus.name}</span>
                                        <div class="details-arrow ml-auto text-gray-500">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>

                                    </summary>
                                    <div class="p-2 bg-gray-50/50 dark:bg-slate-900/50">${subjectsHTML}</div>
                                </details>
                            `;
                        }).join('');

                        const footer = `<div class="flex justify-end"><button id="add-selected-btn" class="bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700">Adicionar Selecionadas</button></div>`;
                        
                        this.renderModal("Adicionar da Biblioteca", `<div class="border border-gray-200 dark:border-slate-700 rounded-lg overflow-hidden">${content || '<p class="p-6 text-center text-gray-500">Nenhuma matéria nova disponível na biblioteca.</p>'}</div>`, footer, 'library-modal');
                        
                        const modal = this.el('active-modal');
                        
                        modal.addEventListener('change', e => {
                            const targetCheckbox = e.target;
                            const syllabusId = targetCheckbox.dataset.syllabusId;
                            
                            if (targetCheckbox.classList.contains('library-syllabus-checkbox')) {
                                const subjectCheckboxes = modal.querySelectorAll(`.library-subject-checkbox[data-syllabus-id="${syllabusId}"]`);
                                subjectCheckboxes.forEach(cb => cb.checked = targetCheckbox.checked);
                            } else if (targetCheckbox.classList.contains('library-subject-checkbox')) {
                                const mainCheckbox = modal.querySelector(`.library-syllabus-checkbox[data-syllabus-id="${syllabusId}"]`);
                                const allSubjectCheckboxes = Array.from(modal.querySelectorAll(`.library-subject-checkbox[data-syllabus-id="${syllabusId}"]`));
                                const checkedCount = allSubjectCheckboxes.filter(cb => cb.checked).length;
                                
                                if (checkedCount === 0) {
                                    mainCheckbox.checked = false;
                                    mainCheckbox.indeterminate = false;
                                } else if (checkedCount === allSubjectCheckboxes.length) {
                                    mainCheckbox.checked = true;
                                    mainCheckbox.indeterminate = false;

                                    mainCheckbox.indeterminate = true;

                        this.el('add-selected-btn').onclick = () => {

                            if (selectedSubjectsInfo.length > 0) {

                },
                
                handlePlannerAction(action, subjectId, topicId) { 
                    const topic = this.findTopic(subjectId, topicId); if (!topic) return;

                    if (action === 'open-construction') {
                        this.renderTopicsModal(subjectId, topicId);
                    } else if (action === 'open-review') {
                        this.renderMissionModal(subjectId, topicId); 
                    } else if (action === 'reschedule') {
                        this.renderRescheduleModal(subjectId, topicId);
                    }
                },

                getTasksAsFlatList() {
                    const tasks = this.getTasks();
                    // The 'future' property contains nested objects by month, so it needs to be flattened twice.
                    const futureTasks = Object.values(tasks.future).flat();
                    return [
                        ...tasks.overdue,
                        ...tasks.today,
                        ...tasks.tomorrow,
                        ...tasks.next7,
                        ...futureTasks
                    ];
                },

                renderPlanner() {
                    const container = this.el('planner-container');
                    if (!container) return;

                    const syllabusColorMap = new Map();
                    let colorIndex = 0;
                    this.data.subjects.forEach(s => {
                        if (s.sourceSyllabusName && !syllabusColorMap.has(s.sourceSyllabusName)) {
                            syllabusColorMap.set(s.sourceSyllabusName, this.syllabusColors[colorIndex % this.syllabusColors.length]);
                            colorIndex++;
                        }
                    });

                    // 1. Get the base list of all tasks
                    const allTopics = this.getTasksAsFlatList();

                    // 2. Apply search and phase filters sequentially
                    const filteredTopics = allTopics.filter(topic => {
                        const searchMatch = this.searchTerm && this.searchTerm.trim() !== ''
                            ? this.getTopicText(topic).toLowerCase().includes(this.searchTerm.toLowerCase())
                            : true;
                        
                        const phaseMatch = this.activePhaseFilters.length > 0
                            ? this.activePhaseFilters.includes(topic.phase.toString())
                            : true;

                        return searchMatch && phaseMatch;
                    });

                    // 3. Distribute the final filtered list back into time-based sections
                    const today = dayjs().tz("America/Sao_Paulo").startOf('day');
                    const tomorrow = today.add(1, 'day');
                    const next7DaysEnd = today.add(7, 'day');
                    
                    const finalTasks = { overdue: [], today: [], tomorrow: [], next7: [], future: {} };
                    
                    filteredTopics.forEach(item => {
                        // This logic is based on the original getTasks() distribution
                        if (item.isPrescribed === true) {
                            finalTasks.today.push({ ...item, taskType: `Reforço (IA)`, isPrescribed: true });
                        } else if (item.phase === 1) {
                            finalTasks.today.push({ ...item, taskType: 'Criar Resumo/Mapa' });
                        } else if (item.nextReviewDate && item.phase >= 2) {
                            const reviewDate = dayjs(item.nextReviewDate, 'YYYY-MM-DD').tz("America/Sao_Paulo", true);
                            if (reviewDate.isBefore(today)) finalTasks.overdue.push(item);
                            else if (reviewDate.isSame(today)) finalTasks.today.push(item);
                            else if (reviewDate.isSame(tomorrow)) finalTasks.tomorrow.push(item);
                            else if (reviewDate.isAfter(tomorrow) && reviewDate.isSameOrBefore(next7DaysEnd)) finalTasks.next7.push(item);
                            else if (reviewDate.isAfter(next7DaysEnd)) {
                                const monthYear = reviewDate.format('YYYY-MM');
                                if (!finalTasks.future[monthYear]) finalTasks.future[monthYear] = [];
                                finalTasks.future[monthYear].push(item);
                            }
                        }
                    });

                    // 4. Render only the sections selected by the period filter
                    const renderSection = (title, items, color, emptyMessage, sectionId) => {
                            const itemsHTML = items.map(item => {
                            const phase = this.phasesData[item.phase];
                            if (!phase) return '';
                            let dueDateText = '';
                            let action = 'open-review';
                            let colorClass = phase.textColor;
                            let topicTitle = this.getTopicText(item); // Usar o nome do tópico por padrão

                            // --- INÍCIO DA NOVA LÓGICA ---
                            if (item.isMultiTopicMission && item.prescribedMission) {
                                const mission = item.prescribedMission;
                                if (mission.type === 'synthesis_practice') {
                                    topicTitle = `Missão de Síntese: ${mission.tag}`;
                                    dueDateText = `✨ Conecte ${mission.relatedTopics.length} tópicos`;
                                } else if (mission.type === 'interleaved_practice') {
                                    topicTitle = `Missão Intercalada: ${mission.tag}`;
                                    dueDateText = `🔄 Diferencie ${mission.relatedTopics.length} tópicos`;
                                }
                            } 
                            // --- FIM DA NOVA LÓGICA ---
                            else if (item.taskType && item.isPrescribed !== true) {
                                dueDateText = item.taskType;
                                action = 'open-construction';
                            } else if (item.isPrescribed === true && item.prescribedMission) {
                                const missionKeywords = {
                                    volume_challenge: "Volume",
                                    risk_mitigation_reinforcement: "Risco",
                                    pattern_correction: "Padrão",
                                    preventive_reinforcement: "Preventivo",
                                    standard_reinforcement: "Manutenção"
                                };
                                const keyword = missionKeywords[item.prescribedMission.type] || "Reforço";
                                dueDateText = `<strong>${keyword}</strong> - Reforço (IA)`;
                                action = 'open-review';
                            } else {
                                switch(sectionId) {
                                    case 'overdue': dueDateText = `Revisão Atrasada`; break;
                                    case 'today': dueDateText = `Revisar Hoje`; break;
                                    case 'tomorrow': dueDateText = `Revisar Amanhã`; break;
                                    case 'next7': dueDateText = `Revisar ${dayjs(item.nextReviewDate).format('dddd')}`; break;
                                }
                            }
                            
                            if (sectionId === 'overdue' && !item.isPrescribed) {
                                colorClass = 'text-red-500';
                            }

                            const subjectData = this.data.subjects.find(s => s.id === item.subjectId);
                            const dotColor = subjectData?.sourceSyllabusName ? syllabusColorMap.get(subjectData.sourceSyllabusName) : 'bg-gray-400';

                            return `
                                <div class="flex items-center justify-between p-3 bg-white dark:bg-slate-800/50 rounded-lg border border-gray-200 dark:border-slate-700 hover:shadow-md transition-shadow duration-200">
                                    <div class="flex-grow cursor-pointer" data-planner-action="${action}" data-subject-id="${item.subjectId}" data-topic-id="${item.id}">
                                        <div class="flex items-center gap-3 mb-1">
                                            ${this.renderICSIndicatorHTML(item.ics)}
                                            <div class="flex-grow">
                                                    <p class="font-medium text-gray-800 dark:text-gray-100">${topicTitle}</p>
                                            </div>
                                            <span title="${phase.name}" class="text-xs font-semibold px-2 py-0.5 ${phase.color} text-white rounded-full">${phase.name}</span>
                                        </div>
                                        <p class="text-sm text-gray-500 dark:text-gray-400">
                                            <span class="flex items-center gap-2">
                                                <span class="h-2 w-2 ${dotColor} rounded-full"></span>
                                                <span>${item.subjectName}</span>
                                            </span>
                                            - <span class="font-semibold ${colorClass}">${dueDateText}</span>
                                        </p>
                                    </div>
                                    ${sectionId === 'overdue' && !item.taskType && !item.isPrescribed ? `
                                    <div class="flex-shrink-0 ml-4">
                                        <button data-planner-action="reschedule" data-subject-id="${item.subjectId}" data-topic-id="${item.id}" class="text-sm bg-gray-200 hover:bg-gray-300 text-gray-800 dark:bg-slate-700 dark:hover:bg-slate-600 dark:text-gray-200 font-semibold py-1 px-3 rounded-md">Reagendar</button>
                                    </div>` : ''}
                                </div>`;
                        }).join('');

                        return `
                                <details class="group bg-white dark:bg-slate-800 rounded-xl shadow-lg p-4" open>
                                    <summary class="flex justify-between items-center cursor-pointer">
                                        <h3 class="text-lg font-semibold flex items-center ${color} dark:text-gray-200">
                                            ${title} 
                                            <span class="ml-2 bg-gray-200 text-gray-700 dark:bg-slate-700 dark:text-gray-300 text-xs font-bold px-2 py-0.5 rounded-full">${items.length}</span>
                                        </h3>
                                        <svg class="w-5 h-5 text-gray-500 group-open:rotate-180 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                    </summary>
                                    <div class="mt-4 space-y-3">${items.length > 0 ? itemsHTML : `<div class="text-center p-4 rounded-lg border border-dashed border-gray-300 dark:border-slate-700 text-gray-500 dark:text-gray-400 text-sm">${emptyMessage}</div>`}</div>
                                </details>`;
                    };
                    
                    const renderFutureSection = () => {
                        const monthKeys = Object.keys(finalTasks.future).sort((a, b) => dayjs(a, 'YYYY-MM').diff(dayjs(b, 'YYYY-MM')));
                        const monthsWithTasks = monthKeys.filter(key => finalTasks.future[key].length > 0);

                        if (monthsWithTasks.length === 0) {
                            return ''; // Don't render the future section if it has no tasks after filtering
                        }
                        
                        const monthsHTML = monthsWithTasks.map(monthYear => {
                            const monthItems = finalTasks.future[monthYear];
                            const displayMonthYear = dayjs(monthYear, 'YYYY-MM').format('MMMM (YYYY)');
                            const itemsHTML = monthItems.map(item => {
                                const phase = this.phasesData[item.phase];
                                if (!phase) return '';
                                const dueDateText = `Vence em ${dayjs(item.nextReviewDate).format('DD/MM/YYYY')}`;
                                return `
                                    <div class="flex items-center justify-between p-3 bg-white dark:bg-slate-800/50 rounded-lg border border-gray-100 dark:border-slate-700/50">
                                        <div class="flex-grow cursor-pointer" data-planner-action="open-review" data-subject-id="${item.subjectId}" data-topic-id="${item.id}">
                                            <div class="flex items-center mb-1">
                                                <span title="${phase.name}" class="text-xs font-semibold px-2 py-0.5 ${phase.color} text-white rounded-full mr-3">${phase.name}</span>
                                                <p class="font-medium text-gray-800 dark:text-gray-200 text-sm">${this.getTopicText(item)}</p>
                                            </div>

                                </label>

                                    <div class="flex items-center">
                                        <input type="radio" name="reset-option" value="full" class="h-4 w-4 text-red-600 focus:ring-red-500 border-gray-300">

                                    </div>
                                    <p class="ml-7 mt-1 text-xs text-gray-500 dark:text-gray-400">Apaga absolutamente tudo, incluindo seu edital personalizado, e restaura sua conta para o estado inicial da plataforma. <strong>Use com extremo cuidado.</strong></p>
                                </label>

                    `;

                            <button id="reset-confirm-btn" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg disabled:bg-red-300 dark:disabled:bg-red-800/50 disabled:cursor-not-allowed" disabled>Confirmar Reset</button>
                        </div>
                    `;

                    this.renderModal(title, content, footer, 'reset-options-modal');

                    // Add event listeners for the modal's internal logic
                    const form = this.el('reset-options-form');
                    const confirmBtn = this.el('reset-confirm-btn');
                    const cancelBtn = this.el('reset-cancel-btn');

                    form.addEventListener('change', () => {
                        confirmBtn.disabled = false;
                    });

                    cancelBtn.onclick = () => this.closeModal();

                    confirmBtn.onclick = () => {
                        const selectedOption = form.querySelector('input[name="reset-option"]:checked');
                        if (!selectedOption) return;

                        const resetType = selectedOption.value;
                        
                        let confirmationMessage = 'Você tem certeza? Esta ação não pode ser desfeita.';
                        if (resetType === 'full') {
                            confirmationMessage = 'ATENÇÃO: Esta é a opção de Reset Total. TODO o seu progresso E o seu edital personalizado serão apagados permanentemente. Deseja continuar?';
                        }

                        // Render a nested confirmation modal for safety
                        this.renderConfirmModal('Confirmar Reset', confirmationMessage, () => {
                            if (resetType === 'study_progress') {
                                this.resetStudyProgress();

                                this.resetGamification();

                                this.resetData(false); // Pass false to prevent double-saving inside resetData

                            this.saveData();
                            this.closeModal(); // Closes the confirmation modal
                            this.closeModal(); // Closes the options modal

                        const xpRequired = cumulativeXp;

                    if (subjects.length === 0) {
                        container.innerHTML = '<p class="p-2 text-sm text-gray-500">Nenhum caderno para exibir.</p>';

                    }

                    // 1. Preparation
                    container.innerHTML = `
                        <div class="flex justify-between items-center w-full">

                                <div id="cadernos-dropdown-menu" class="hidden"></div>
                            </div>
                        </div>
                    `;

                    const visibleContainer = this.el('visible-tabs-container');
                    const dropdownContainer = this.el('dropdown-container');
                    const dropdownMenu = this.el('cadernos-dropdown-menu');

                    // 2. Initial Render
                    subjects.forEach(subject => {
                        const isActive = subject.id === this.cadernosState.activeSubjectId;
                        const btn = document.createElement('button');
                        btn.className = `tab-btn flex-shrink-0 px-4 py-2 text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-200 whitespace-nowrap ${isActive ? 'active' : ''}`;
                        btn.textContent = subject.name;
                        btn.dataset.subjectId = subject.id;
                        visibleContainer.appendChild(btn);
                    });

                    // 3. Verification and Correction Loop
                    while (visibleContainer.scrollWidth > visibleContainer.offsetWidth) {
                        let lastVisibleTab = visibleContainer.lastElementChild;
                        if (!lastVisibleTab) break;

                        visibleContainer.removeChild(lastVisibleTab);

                        // Re-create as an 'a' tag for the dropdown
                        const link = document.createElement('a');
                        link.href = '#';
                        link.className = 'dropdown-item block px-4 py-2 text-sm text-gray-700 dark:text-gray-200 hover:bg-gray-100 dark:hover:bg-slate-600';
                        link.dataset.subjectId = lastVisibleTab.dataset.subjectId;
                        link.textContent = lastVisibleTab.textContent;

                        dropdownMenu.prepend(link);
                    }

                    // 4. Conditional Dropdown Display
                    if (dropdownMenu.children.length > 0) {
                        dropdownContainer.classList.remove('hidden');
                        // Add dropdown-specific classes now that we know it exists
                        dropdownMenu.classList.add('absolute', 'right-0', 'mt-2', 'w-56', 'bg-white', 'dark:bg-slate-700', 'rounded-md', 'shadow-lg', 'z-20');
                    }

                renderSubjects() {
                    if (!this.subjectsGrid) return;

                    if (!this.data.subjects || this.data.subjects.length === 0) {
                        this.subjectsGrid.innerHTML = `
                            <div class="col-span-full mt-8">
                                <div class="text-center max-w-lg mx-auto p-8 rounded-xl border-2 border-dashed border-gray-300 dark:border-slate-700 text-gray-500 dark:text-gray-400 bg-white dark:bg-slate-800 shadow-lg">
